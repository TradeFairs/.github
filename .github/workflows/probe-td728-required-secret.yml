# Disposable scratch probe (k8s-workspace:TD-728) — bisect step 3: adds the
# base/head refs-computation step on top of the already-ruled-out
# permissions/job-id/timeout changes. Still no name: at top level, still
# ends with the same diagnostic echo (not yet the real gate execution).
on:
  workflow_call:
    secrets:
      NPM_TOKEN:
        required: true
        description: Probe secret, mirrors app-adr073-verdict-gate.yml's shape.

permissions:
  contents: read

jobs:
  adr073-verdict-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Fetch ADR-073 verdict-gate script from k8s-workspace (pinned)
        uses: actions/checkout@v5
        with:
          repository: TradeFairs/k8s-workspace
          ref: 5670dfdd2d69d796a417a1acba68bbeadded6bc9
          token: ${{ secrets.NPM_TOKEN }}
          sparse-checkout: |
            bin/preflight-checks-adr073-verdict.py
          sparse-checkout-cone-mode: false
          path: _adr073-gate-script

      - name: Compute base/head refs for the diff
        id: refs
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "base=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_OUTPUT"
            echo "head=${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "base=${{ github.event.before }}" >> "$GITHUB_OUTPUT"
            echo "head=${{ github.event.after }}" >> "$GITHUB_OUTPUT"
          fi

      - run: echo "refs step completed: base=${{ steps.refs.outputs.base }} head=${{ steps.refs.outputs.head }}"
