# Disposable scratch probe (k8s-workspace:TD-728) — bisect step 4: adds the
# final gate-execution step (python3 preflight-checks-adr073-verdict.py),
# making this now byte-identical to the real app-adr073-verdict-gate.yml
# except for the filename and top-level name:. This is the LAST remaining
# untested diff after permissions/job-id/timeout/refs-step were all ruled
# out individually (each one succeeded, scheduled a real job).
name: App ADR-073 Verdict Gate (reusable)

on:
  workflow_call:
    secrets:
      NPM_TOKEN:
        required: true
        description: Probe secret, mirrors app-adr073-verdict-gate.yml's shape.

permissions:
  contents: read

jobs:
  adr073-verdict-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Fetch ADR-073 verdict-gate script from k8s-workspace (pinned)
        uses: actions/checkout@v5
        with:
          repository: TradeFairs/k8s-workspace
          ref: 5670dfdd2d69d796a417a1acba68bbeadded6bc9
          token: ${{ secrets.NPM_TOKEN }}
          sparse-checkout: |
            bin/preflight-checks-adr073-verdict.py
          sparse-checkout-cone-mode: false
          path: _adr073-gate-script

      - name: Compute base/head refs for the diff
        id: refs
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "base=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_OUTPUT"
            echo "head=${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "base=${{ github.event.before }}" >> "$GITHUB_OUTPUT"
            echo "head=${{ github.event.after }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Run ADR-073 verdict gate (steady mode)
        env:
          ADR073_GATE_MODE: steady
          PREFLIGHT_ADR073_VERDICT: error
        run: |
          python3 _adr073-gate-script/bin/preflight-checks-adr073-verdict.py . \
            --base "${{ steps.refs.outputs.base }}" \
            --head "${{ steps.refs.outputs.head }}"
