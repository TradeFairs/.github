# app-adr073-verdict-gate.yml — reusable workflow: ADR-073 §2 deletion gate
# (k8s-workspace TD-712 / PLAN-228). Blocks any commit that deletes a
# `.codex/tasks/TD-*.md` file unless exactly one of the four verdict forms
# (`promoted:`/`covered:`/`transferred:BACKLOG.md`/`no-promotion:no-durable-content`)
# is recorded in that commit's `TD-Verdict:` trailer, and all six D3
# integrity invariants hold (see the script's own module docstring, fetched
# from k8s-workspace below, for the full spec).
#
# Callers: TradeFairs/<app>/.github/workflows/adr073-verdict-gate.yml
#   (uses: TradeFairs/.github/.github/workflows/app-adr073-verdict-gate.yml@<pinned-ref>)
#
# --- Script stays canonical in k8s-workspace (TD-712 decision, 2026-08-12) ---
#
# ADR-073 itself lives in k8s-workspace; amendments to the gate script are
# implemented there, not duplicated here. This reusable workflow fetches
# `bin/preflight-checks-adr073-verdict.py` from k8s-workspace via a SPARSE
# checkout pinned to an explicit commit SHA (never a floating branch ref) —
# identical trust model to this repo's own version-pin discipline for
# `app-ci.yml`/`app-release.yml`/`app-deploy-test.yml` (callers pin an
# explicit tag, not `@main`; a script change ships under a new pin and each
# consumer bumps to it on its own schedule/PR, never silently/retroactively).
#
# k8s-workspace does not yet tag releases for this script (no CHANGELOG/tag
# convention exists there the way `TradeFairs/.github` has one) — pinned by
# commit SHA for now. See TD-712 Retrospective for the follow-up on whether
# k8s-workspace should start tagging this script the same way.
#
# --- Cross-repo checkout auth (k8s-workspace TD-728) ---
#
# The sparse checkout of `TradeFairs/k8s-workspace` below is a DIFFERENT
# private repo from the calling repo, so the default `GITHUB_TOKEN` (scoped
# only to the calling repo) cannot read it — `actions/checkout@v5` fails with
# `fatal: repository ... not found` before the gate script ever runs (found
# live via k8s-workspace:TD-722's Step 6/7 live-fire test on `bvv-platform`,
# fixed by k8s-workspace:TD-728). `workflow_call:` therefore declares a
# required `NPM_TOKEN` secret input and passes it as `token:` on that
# checkout step. Every caller of this reusable workflow MUST forward it —
# `secrets: inherit` on the caller's `uses:` block is the simplest way,
# since `NPM_TOKEN` already lives on each caller repo for this exact
# cross-repo-checkout purpose (see `td-linkage-pr-gate.yml`'s and
# `air-declaration-audit.yml`'s identical prior-art pattern in
# `bvv-platform`, PLAN-140 fleet convention #1). A caller that omits
# `secrets:`/`secrets: inherit` will fail this same checkout step.
#
# --- Base/head computation matches the k8s-workspace-local workflow ---
#
# Same logic as k8s-workspace's own `.github/workflows/adr073-verdict-gate.yml`
# (TD-634): PR events diff `pull_request.base.sha...pull_request.head.sha`,
# push events diff `github.event.before...github.event.after`. The CALLER's
# checkout (not this reusable workflow's own — see below) needs
# `fetch-depth: 0` for the same reason documented there: the script needs
# `git diff --diff-filter=D <base>...<head>` to find deletions, which needs
# the merge-base locally, which a shallow clone would silently miss for
# anything but a trivial one-commit-deep PR.

name: App ADR-073 Verdict Gate (reusable)

on:
  workflow_call:
    secrets:
      NPM_TOKEN:
        required: true
        description: >-
          Cross-repo-scoped PAT used to check out the private
          TradeFairs/k8s-workspace repo (gate script source). Must be
          forwarded by the caller via `secrets: inherit` (or an explicit
          `NPM_TOKEN: ${{ secrets.NPM_TOKEN }}` pass-through).

permissions:
  contents: read

jobs:
  adr073-verdict-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Full-history checkout of the CALLING repo itself (the repo whose
      # .codex/tasks/ deletions are being gated) — this is the default
      # checkout target (no `repository:` input), matching app-ci.yml's own
      # `uses: actions/checkout@v5` with no repository override.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # Sparse checkout of ONLY the gate script from k8s-workspace, pinned to
      # an explicit commit SHA (not a branch/tag) — a controlled, reviewable
      # bump, never a floating live dependency. Checked out into a
      # subdirectory so it never collides with the calling repo's own tree.
      - name: Fetch ADR-073 verdict-gate script from k8s-workspace (pinned)
        uses: actions/checkout@v5
        with:
          repository: TradeFairs/k8s-workspace
          ref: 5670dfdd2d69d796a417a1acba68bbeadded6bc9
          token: ${{ secrets.NPM_TOKEN }}
          sparse-checkout: |
            bin/preflight-checks-adr073-verdict.py
          sparse-checkout-cone-mode: false
          path: _adr073-gate-script

      - name: Compute base/head refs for the diff
        id: refs
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "base=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_OUTPUT"
            echo "head=${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "base=${{ github.event.before }}" >> "$GITHUB_OUTPUT"
            echo "head=${{ github.event.after }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Run ADR-073 verdict gate (steady mode)
        env:
          ADR073_GATE_MODE: steady
          PREFLIGHT_ADR073_VERDICT: error
        run: |
          python3 _adr073-gate-script/bin/preflight-checks-adr073-verdict.py . \
            --base "${{ steps.refs.outputs.base }}" \
            --head "${{ steps.refs.outputs.head }}"
