# app-deploy-test.yml — reusable deploy-to-test workflow (ADR-023 §K.2).
# Happy path is ADR-034 promotion (retag the PR image, no build). When no PR
# image exists (mainly workflow_dispatch), the FALLBACK rebuild path is
# selected by `imageStrategy`: docker (default, buildx from the app
# Dockerfile) | crane (layer-append via the caller-local
# .github/actions/deploy-test-crane-image composite) — ADR-083 krok 5c.
# build job runs on GitHub-hosted runner (internet access for ghcr.io push).
# deploy job runs on self-hosted runner (direct kubectl access to k3s on liv11).
# Callers: TradeFairs/<app>/.github/workflows/deploy-test.yml (uses: TradeFairs/.github/.github/workflows/app-deploy-test.yml@main)
name: App Deploy to test (reusable)

on:
  workflow_call:
    inputs:
      slug:
        required: true
        type: string
      basePath:
        required: true
        type: string
      # ── Optional profile knobs (TD-224 / PLAN-131 / ADR-045) ─────────────────
      smokeMode:
        description: >-
          Smoke-test transport: ingress (default — public
          https://test-liv11.brno.bvv.cz<basePath>/api/version) | port-forward
          (kubectl port-forward to the Service + curl via localhost, for
          cluster-internal apps without an IngressRoute — ADR-020 security
          boundary, ADR-045 api-internal profile, e.g. bvv-directory-api).
        type: string
        default: ingress
      ciRunsOn:
        description: >-
          JSON array (as a string) of runner labels for the `build` job,
          consumed via `fromJSON(inputs.ciRunsOn)` (TD-273 / ADR-047 §C).
          Default is a no-op — every existing caller keeps building on
          GitHub-hosted `ubuntu-latest` until it opts in (e.g.
          '["self-hosted","liv26"]'). The `deploy` job is unaffected — it
          stays pinned to the literal `[self-hosted, liv11]` label.
        type: string
        default: '"ubuntu-latest"'
      appPath:
        description: >-
          Monorepo-relative path (e.g. `apps/<slug>`) to read the version for
          the image tag / smoke assertion from, instead of the repo-root
          `package.json` (TD-625 / ADR-071 §12.1 — the monorepo root version
          has no meaning and nothing may be derived from it). Default is a
          no-op empty string: every existing standalone-repo caller keeps
          reading its own repo-root `package.json` unchanged (Acceptance
          Criterion 6) until it opts in from inside the future consolidated
          `bvv-platform` monorepo (ADR-071 step 4+, not in scope here).
        type: string
        default: ''
      imageStrategy:
        description: >-
          How the FALLBACK test image is built when no PR image was found to
          promote (ADR-083 krok 5c, k8s-workspace): `docker` (default — buildx
          build from the app Dockerfile, byte-identical to today for every
          existing caller) | `crane` (layer-append onto the pinned
          bvv-app-base via the CALLER-LOCAL composite
          `.github/actions/deploy-test-crane-image`).

          This input does NOT affect the happy path: when a PR image exists it
          is promoted by retag (ADR-034), no build of either kind happens.
          It only selects which way the fallback rebuild goes — in practice
          the `workflow_dispatch` path, which has no PR to promote from.

          That composite exists only in TradeFairs/bvv-platform (it resolves
          per-app data from that repo's INVENTORY), so only the monorepo may
          opt in; a standalone caller passing `crane` fails at the `uses:`
          resolution, loudly, not silently.
        type: string
        default: 'docker'
      require_pr_image:
        description: >-
          Scoped opt-in (TD-684, operator decision 2026-08-17): when `true`,
          the "Resolve PR image" step's three degrade-to-fallback cases (`gh
          api` failure, no PR found for the merge SHA, `imagetools inspect`
          not-found) become a hard job failure instead of falling through to
          the "Build and push test image (fallback...)" rebuild step. Default
          is a no-op `false`: every existing caller keeps today's exact
          fail-open behavior until it opts in. Only `bvv-platform`'s 11
          `deploy-<slug>` callers set this to `true`; the 9 external
          standalone-repo callers and `bvv-platform`'s own direct-push
          recovery path are unaffected.
        type: boolean
        default: false
      loadRestrictor:
        description: >-
          Extra flag passed to `kubectl kustomize` when rendering the overlay
          (PLAN-250 krok 4). Default `''` = today's exact behavior for every
          caller. The only intended value is
          `--load-restrictor=LoadRestrictionsNone`, needed by `jira-status`,
          whose configMapGenerator reads `../../notification_rules.yaml` from
          outside `k8s/`. Do NOT set it fleet-wide: the default restrictor is
          what keeps an overlay from silently reaching into arbitrary files.
        type: string
        default: ''

concurrency:
  group: deploy-${{ inputs.slug }}
  cancel-in-progress: false  # never cancel a running deploy mid-rollout

permissions:
  contents: read
  packages: write
  pull-requests: read  # ADR-034 "Resolve PR image" calls gh api .../commits/<sha>/pulls

jobs:
  # ── 1. Build & push image ────────────────────────────────────────────────────
  build:
    runs-on: ${{ fromJSON(inputs.ciRunsOn) }}
    env:
      IMAGE: ghcr.io/tradefairs/${{ inputs.slug }}
    outputs:
      version: ${{ steps.version.outputs.version }}
      image_tag: ${{ steps.version.outputs.image_tag }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate imageStrategy
        run: |
          case "${{ inputs.imageStrategy }}" in
            docker|crane) ;;
            *) echo "::error::imageStrategy must be 'docker' or 'crane', got '${{ inputs.imageStrategy }}'"; exit 1 ;;
          esac

      - name: Compute buildx driver-opts + build-args (self-hosted proxy passthrough)
        # TD-280: see app-ci.yml for the full rationale — the buildx
        # docker-container driver's builder doesn't inherit this job's proxy
        # env, so forward it dynamically (empty on ubuntu-latest, no-op there).
        # TD-281: Dockerfile RUN steps (pnpm/npm install) need the same values
        # as build-args instead (Docker's predefined ARGs — no Dockerfile
        # `ARG` declaration needed).
        # TD-282: force the classic `docker` driver on self-hosted so cache is
        # genuinely shared (see app-ci.yml for the full rationale — the
        # docker-container driver's per-job throwaway builder never persisted
        # cache across jobs/runners).
        id: buildx_opts
        # ADR-083 krok 5c: driver-opts/build-args slouzi VYHRADNE docker
        # fallback buildu nize, takze se pri crane strategii nepocitaji.
        # `docker/setup-buildx-action` nize ale gatovane ZAMERNE NENI:
        # `Promote PR image` (happy path, obe strategie) vola
        # `docker buildx imagetools create`, ktere potrebuje buildx CLI
        # plugin. Gatovat setup by rozbilo promotion na runnerech, kde buildx
        # neni predinstalovany — a to je hlavni cesta, ne fallback.
        if: inputs.imageStrategy == 'docker'
        shell: bash
        run: |
          # opts<<EOF/EOF and build_args<<EOF/EOF below are safe only because
          # HTTP_PROXY/HTTPS_PROXY are operator-set proxy URLs, never
          # untrusted input.
          {
            if [ -n "${HTTP_PROXY:-}" ]; then echo "env.HTTP_PROXY=${HTTP_PROXY}"; fi
            if [ -n "${HTTPS_PROXY:-}" ]; then echo "env.HTTPS_PROXY=${HTTPS_PROXY}"; fi
          } > /tmp/buildx-driver-opts.txt
          {
            if [ -n "${HTTP_PROXY:-}" ]; then echo "HTTP_PROXY=${HTTP_PROXY}"; fi
            if [ -n "${HTTPS_PROXY:-}" ]; then echo "HTTPS_PROXY=${HTTPS_PROXY}"; fi
          } > /tmp/buildx-build-args.txt
          {
            echo 'opts<<EOF'
            cat /tmp/buildx-driver-opts.txt
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
          {
            echo 'build_args<<EOF'
            cat /tmp/buildx-build-args.txt
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
          if [ -n "${HTTP_PROXY:-}" ]; then
            echo "driver=docker" >> "$GITHUB_OUTPUT"
          else
            echo "driver=" >> "$GITHUB_OUTPUT"
          fi

      # ADR-083 krok 5c: ZAMERNE negatovane — `Promote PR image` (happy path
      # obou strategii) vola `docker buildx imagetools create`. Pri crane
      # strategii je krok `buildx_opts` vyse preskoceny, takze obe hodnoty
      # nize jsou prazdne = default chovani akce (auto driver, zadne opts).
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
        with:
          driver: ${{ steps.buildx_opts.outputs.driver }}
          driver-opts: ${{ steps.buildx_opts.outputs.driver == '' && steps.buildx_opts.outputs.opts || '' }}

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.NPM_TOKEN }}

      - name: Resolve PR image (ADR-034 — promote instead of rebuild)
        id: pr_image
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REQUIRE_PR_IMAGE: ${{ inputs.require_pr_image }}
        run: |
          # Find the PR merged into this commit; its head SHA is the :pr-<sha> tag
          # ci.yml (app-ci.yml@v2) built. On merge we retag that image — no rebuild.
          # Resilient (ADR-034 "never fail closed"): if the API call fails (missing
          # pull-requests:read, transient 5xx), degrade to fallback rebuild, don't abort.
          # TD-684: when require_pr_image=true (bvv-platform's own callers only, per
          # the 2026-08-17 operator decision), all three degrade-to-fallback cases
          # below become a hard failure instead — no fallback rebuild is reachable.
          if ! PR_SHA=$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/pulls" --jq '.[0].head.sha // ""' 2>/dev/null); then
            if [ "$REQUIRE_PR_IMAGE" = "true" ]; then
              echo "::error::require_pr_image=true: gh api commits/<sha>/pulls failed (permissions/transient) — refusing to fall back to rebuild"
              exit 1
            fi
            echo "::warning::gh api commits/<sha>/pulls failed (permissions/transient) — falling back to rebuild"
            echo "image_found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "$PR_SHA" ]; then
            if [ "$REQUIRE_PR_IMAGE" = "true" ]; then
              echo "::error::require_pr_image=true: no PR associated with merge ${{ github.sha }} (direct push?) — refusing to fall back to rebuild"
              exit 1
            fi
            echo "No PR associated with merge ${{ github.sha }} (direct push?). Falling back to rebuild."
            echo "image_found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Resolved PR head SHA: $PR_SHA"
          echo "pr_sha=$PR_SHA" >> "$GITHUB_OUTPUT"
          if docker buildx imagetools inspect "ghcr.io/tradefairs/${{ inputs.slug }}:pr-$PR_SHA" >/dev/null 2>&1; then
            echo "image_found=true" >> "$GITHUB_OUTPUT"
          else
            if [ "$REQUIRE_PR_IMAGE" = "true" ]; then
              echo "::error::require_pr_image=true: ghcr.io/tradefairs/${{ inputs.slug }}:pr-$PR_SHA not found — refusing to fall back to rebuild"
              exit 1
            fi
            echo "::warning::ghcr.io/tradefairs/${{ inputs.slug }}:pr-$PR_SHA not found; will rebuild"
            echo "image_found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Read version from package.json
        id: version
        env:
          APP_PATH: ${{ inputs.appPath }}
        run: |
          # TD-625 / ADR-071 §12.1: when appPath is set (future monorepo caller only —
          # every one of today's 13 standalone-repo callers leaves it unset), read the
          # version from apps/<slug>/package.json instead of the repo-root package.json;
          # the monorepo root version has no meaning and nothing may be derived from it.
          # Default (empty APP_PATH) preserves today's exact repo-root-relative command
          # unchanged, so this branch is a no-op for all existing callers.
          if [ -n "$APP_PATH" ]; then
            VERSION=$(node -p "require('./${APP_PATH}/package.json').version")
          else
            VERSION=$(node -p "require('./package.json').version")
          fi
          # Pre-flight: main must always be in SNAPSHOT state (ADR-023 §B.2).
          if [[ "$VERSION" != *-SNAPSHOT ]]; then
            echo "::error::package.json version '$VERSION' does not end with -SNAPSHOT."
            echo "::error::main branch must always be in SNAPSHOT state. Run the release"
            echo "::error::workflow to bump after a release, or fix package.json manually."
            exit 1
          fi
          SHORT_SHA="${GITHUB_SHA::7}"
          IMAGE_TAG="${VERSION}-test-${SHORT_SHA}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "image_tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION  Image tag: $IMAGE_TAG"

      - name: Promote PR image (retag, no rebuild)
        if: steps.pr_image.outputs.image_found == 'true'
        env:
          IMAGE: ghcr.io/tradefairs/${{ inputs.slug }}
          PR_SHA: ${{ steps.pr_image.outputs.pr_sha }}
          IMAGE_TAG: ${{ steps.version.outputs.image_tag }}
        run: |
          docker buildx imagetools create -t "$IMAGE:$IMAGE_TAG" -t "$IMAGE:test" "$IMAGE:pr-$PR_SHA"
          echo "Promoted $IMAGE:pr-$PR_SHA → $IMAGE:$IMAGE_TAG and :test"

      # ── Docker fallback path (imageStrategy: docker — every standalone caller) ──
      - name: Build and push test image (fallback — no PR image found)
        if: steps.pr_image.outputs.image_found != 'true' && inputs.imageStrategy == 'docker'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          # TD-821: the DOCKERFILE follows `appPath`; the BUILD CONTEXT does not
          # and must stay the repo root. This asymmetry is measured, not assumed:
          # every one of the 13 apps' Dockerfiles is written root-context-relative
          # (54 `COPY packages/<pkg>/package.json`, `COPY apps/<slug>/…` and
          # `COPY pnpm-workspace.yaml` lines apiece — the pnpm workspace siblings
          # live OUTSIDE `apps/<slug>`). Narrowing the context to `apps/<slug>`
          # was tried in v2.4.0 and fails at `COPY`:
          #   failed to calculate checksum of ref …: "/packages/ui/package.json": not found
          # (`bvv-platform` run 31822241715). So only `file:` is threaded.
          #
          # `file` is a PROVEN no-op when empty, in the action's own source
          # (v7 = docker/build-push-action src/context.ts): it is emitted only
          # under `if (inputs.file)`, so an empty string appends no `--file` flag
          # at all, and `action.yml` gives it no default. Every existing
          # standalone-repo caller therefore runs the byte-identical buildx
          # command it runs today. This is the fix for the live failure in
          # `bvv-platform`'s `deploy-affected.yml`, which already passes
          # `appPath: apps/<slug>` for 11 apps and whose every build job failed
          # with `failed to read dockerfile: open Dockerfile: no such file or
          # directory`. `context:` is deliberately NOT set — today's default
          # context is already correct for both cases.
          file: ${{ inputs.appPath != '' && format('{0}/Dockerfile', inputs.appPath) || '' }}
          push: true
          secrets: |
            NPM_TOKEN=${{ secrets.NPM_TOKEN }}
          build-args: |
            APP_BASE_PATH=${{ inputs.basePath }}
            NEXT_PUBLIC_APP_BASE_PATH=${{ inputs.basePath }}
            NEXT_PUBLIC_BVV_ENV=test
            NEXT_PUBLIC_APP_VERSION=${{ steps.version.outputs.version }}
            APP_GIT_COMMIT=${{ github.sha }}
            APP_BUILD_TIME=${{ fromJSON(toJSON(github.event.head_commit.timestamp)) }}
            ${{ steps.buildx_opts.outputs.build_args }}
          tags: |
            ghcr.io/tradefairs/${{ inputs.slug }}:${{ steps.version.outputs.image_tag }}
            ghcr.io/tradefairs/${{ inputs.slug }}:test
          cache-from: type=registry,ref=ghcr.io/tradefairs/${{ inputs.slug }}:buildcache
          cache-to: |
            type=registry,ref=ghcr.io/tradefairs/${{ inputs.slug }}:buildcache,mode=max
            type=inline

      # ── Crane fallback path (imageStrategy: crane — ADR-083 krok 5c) ─────────
      # Tentyz fallback, jen layer-append misto Docker buildu. Composite je
      # caller-lokalni (zije jen v TradeFairs/bvv-platform) a drzi vsechna
      # per-app data — sdileny workflow o nich nevi, takze se meni bez noveho
      # tagu tohohle repa. Tag predavame explicitne, aby byl identicky s tim,
      # co by pushnul docker fallback vyse: deploy job nize dela `ctr pull`
      # prave na `needs.build.outputs.image_tag`.
      - name: Build and push test image (fallback — crane layer-append)
        if: steps.pr_image.outputs.image_found != 'true' && inputs.imageStrategy == 'crane'
        uses: ./.github/actions/deploy-test-crane-image
        with:
          app: ${{ inputs.slug }}
          base-path: ${{ inputs.basePath }}
          image-tag: ${{ steps.version.outputs.image_tag }}
          git-commit: ${{ github.sha }}
          npm-token: ${{ secrets.NPM_TOKEN }}

  # ── 2. Deploy to <slug>-test namespace ──────────────────────────────────────
  deploy:
    # Pin to the liv11 runner: this job needs sudo + direct kubectl/k3s access to
    # the liv11 cluster. The liv56-test-gate runner also carries the default
    # `self-hosted` label but has neither, so a bare `runs-on: self-hosted` could
    # land here and fail with `sudo: command not found`.
    runs-on: [self-hosted, liv11]
    needs: build
    env:
      IMAGE: ghcr.io/tradefairs/${{ inputs.slug }}
      IMAGE_TAG: ${{ needs.build.outputs.image_tag }}
      # TD-821: `deploy` is a SEPARATE job from `build`, and `appPath` was so far
      # only consumed by the build job's version step — hence re-declared here.
      APP_PATH: ${{ inputs.appPath }}
      # TD-821: repo-root-relative path to the app's `k8s/` directory. With the
      # default empty `appPath` this is the literal 'k8s' used today at all
      # test-overlay and job-migrate sites; a monorepo caller passing
      # `apps/service-desk` gets 'apps/service-desk/k8s'.
      K8S_DIR: ${{ inputs.appPath != '' && format('{0}/k8s', inputs.appPath) || 'k8s' }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout infra-liv11 (cluster-specific SOPS material, ADR-082)
        # ADR-082: SOPS material for a cluster lives in that cluster's infra repo
        # at `environments/{prod,test}/<app>/secrets.enc.yaml`, so the decrypt
        # step below needs infra-liv11 IN THE WORKSPACE — this job otherwise only
        # ever consumes infra-liv11 as a remote kustomize base (Apply manifests).
        #
        # `path:` is MANDATORY: a default-path checkout would overwrite the
        # caller's own checkout above and break every later step.
        #
        # `NPM_TOKEN`, not `GITHUB_TOKEN`: infra-liv11 is PRIVATE and
        # `GITHUB_TOKEN` is scoped to the caller's own repo, so it cannot read
        # it. `NPM_TOKEN` is org-scoped, exists in every caller repo, and is
        # already used by THIS job for exactly this repo (the remote kustomize
        # base url-rewrite in "Apply manifests"). It reaches this reusable
        # workflow because every caller passes `secrets: inherit` — the
        # `workflow_call` block deliberately declares NO `secrets:` section, and
        # adding one would break every existing caller.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: TradeFairs/infra-liv11
          path: .infra-liv11
          ref: main
          token: ${{ secrets.NPM_TOKEN }}

      - name: Resolve overlay dir and test namespace
        # PLAN-250 krok 4: the overlay is migrating from the app repo
        # (`k8s/overlays/test/`) into infra-liv11 (`environments/test/<slug>/`),
        # per app. Both shapes must therefore work simultaneously — infra first,
        # app repo as the legacy fallback. Mirrors the infra-first-with-warning
        # pattern the SOPS decrypt step below already established.
        #
        # The kustomize `namespace:` directive in the overlay is the canonical
        # target namespace — `kubectl apply -f` (below) honours it, so the
        # verify/rollout steps must use the SAME namespace, not assume
        # slug+"-test". Falls back to `<slug>-test` when the overlay omits it.
        #
        # TD-821: this is also the single place that validates `appPath`
        # resolves. An app with NEITHER overlay must fail LOUDLY here rather
        # than let `awk` return empty, silently fall back to `<slug>-test` and
        # deploy an image into a namespace whose manifests were never rendered.
        run: |
          # PLAN-250 krok 4 dokončen: test overlaye žijí VÝHRADNĚ v infra-liv11
          # (ověřeno 2026-08-30 pro všech 13 appek; žádná nemá k8s/overlays/test).
          # In-app fallback zrušen — chybějící kustomization je tvrdý fail,
          # ne tichý přechod na legacy tvar. (cattle-not-pets fáze 5)
          OVERLAY_DIR=".infra-liv11/environments/test/${{ inputs.slug }}"

          if [ ! -f "$OVERLAY_DIR/kustomization.yaml" ]; then
            echo "::error::No kustomization.yaml at $OVERLAY_DIR — appPath='${APP_PATH}' does not resolve to a migrated app overlay. Refusing to deploy."
            exit 1
          fi
          echo "Overlay: $OVERLAY_DIR"

          NS=$(awk '/^namespace:[[:space:]]/{print $2; exit}' "$OVERLAY_DIR/kustomization.yaml")
          NS=${NS:-${{ inputs.slug }}-test}
          echo "OVERLAY_DIR=$OVERLAY_DIR" >> "$GITHUB_ENV"
          echo "NS=$NS" >> "$GITHUB_ENV"
          echo "Resolved test namespace from $OVERLAY_DIR: $NS"

      - name: Ensure namespace exists
        # Cattle-not-pets fáze 1 (platform-workspace docs/design/cattle-not-pets.md):
        # namespace zakládá deploy, ne SSH. Musí běžet PŘED aplikací Secretu a
        # ConfigMapy (obě jdou s `-n "$NS"` do namespace, který u čerstvé appky
        # ještě neexistuje).
        #
        # Chybějící soubor NENÍ tichý skip (known-issues §9, opraveno
        # 2026-08-31). Původní `else -> ::notice + pokračuj` nerozlišoval
        # "appka namespace nevlastní" od "soubor chybí omylem", takže běh
        # zezelenal, aniž se cokoli aplikovalo. Naměřeno na `jira-status-web`:
        # jeho prod overlay má `namespace: jira-status` (sdílený s `jira-status`),
        # `namespace.yaml` nemá, krok skipnul — a existující `Verify prod
        # namespace exists` to nechytil, protože ověřuje EXISTENCI namespace,
        # ne jeho VLASTNICTVÍ. Namespace existoval jen díky tomu, že release
        # `jira-status` proběhl dřív; při opačném pořadí by chyběl i label
        # `bvv.cz/trust-liv11-ca`.
        #
        # Zakládat druhý `namespace.yaml` opravou není — dva vlastníci téhož
        # objektu jsou vada sama o sobě. Vlastnictví se proto deklaruje:
        # komentářem `# bvv.cz/namespace-owner: <cesta|slug>` v
        # `kustomization.yaml`. Není-li
        # deklarováno a soubor chybí → fail. Jsou-li obojí → fail (dva vlastníci).
        run: |
          NS_FILE=".infra-liv11/environments/test/${{ inputs.slug }}/namespace.yaml"
          KUST=".infra-liv11/environments/test/${{ inputs.slug }}/kustomization.yaml"
          # Deklarovaný vlastník namespace. Prázdná hodnota = appka namespace
          # vlastní sama a `namespace.yaml` MUSÍ existovat. Nosičem je
          # `kustomization.yaml` (ne `params.yaml`) — ten má KAŽDÝ overlay,
          # zatímco `params.yaml` jen ty, které staví na `k8s-base` (8 ze 14
          # ho 2026-08-31 nemělo).
          OWNER=$(sed -n 's/^#[[:space:]]*bvv\.cz\/namespace-owner:[[:space:]]*//p' "$KUST" | head -1)

          if [ -f "$NS_FILE" ]; then
            if [ -n "$OWNER" ]; then
              echo "::error::$KUST deklaruje namespace-owner=$OWNER, ale $NS_FILE existuje — dva vlastníci téhož objektu. Smaž jedno z nich."
              exit 1
            fi
            sudo kubectl apply -f "$NS_FILE"
          elif [ -n "$OWNER" ]; then
            echo "::notice::Namespace '$NS' vlastní '$OWNER' — tato appka ho nezakládá (deklarováno v $KUST)."
          else
            echo "::error::Chybí $NS_FILE a $KUST nedeklaruje vlastníka. Buď appka namespace vlastní (doplň namespace.yaml), nebo ho vlastní někdo jiný (doplň komentář '# bvv.cz/namespace-owner: <cesta|slug>' do kustomization.yaml). Odmítám tiše přeskočit."
            exit 1
          fi

      - name: Free Docker disk space
        run: sudo docker system prune -f

      - name: Ensure k3s containerd proxy
        run: |
          DESIRED='HTTP_PROXY=http://bvvproxy.brno.bvv.cz:8080
          HTTPS_PROXY=http://bvvproxy.brno.bvv.cz:8080
          NO_PROXY=localhost,127.0.0.1,10.0.0.0/8,192.168.0.0/16,.svc,.cluster.local'
          ENV_FILE=/etc/systemd/system/k3s.service.env
          CURRENT=$(cat "$ENV_FILE" 2>/dev/null || true)
          if [ "$DESIRED" != "$CURRENT" ]; then
            echo "$DESIRED" | sudo tee "$ENV_FILE"
            sudo systemctl daemon-reload
            sudo systemctl restart k3s
            echo "k3s restarted. Waiting 15s..."
            sleep 15
          else
            echo "Proxy env unchanged, skipping k3s restart."
          fi
          sudo kubectl get nodes

      - name: Pull image into k3s containerd
        run: |
          # TD-822: pull with `NPM_TOKEN`, NOT `GITHUB_TOKEN`.
          #
          # `GITHUB_TOKEN` is scoped to the repository the run lives in. Every
          # ghcr package here is owned by the org but *linked* to a repo, and
          # that link is what a repo-scoped token is checked against:
          #   - 6 packages (service-desk, service-catalog, dovolenky,
          #     bvv-directory-api, jira-status-web, jira-status) are `private`
          #     and still linked to their old single-app source repo;
          #   - 7 (bvv-test-admin, bvv-notification-hub, bvv-mcp-gateway,
          #     bvv-platform-assistant, bvv-portal, gis-dms, bvv-directory-web)
          #     are `internal` and linked to no repo at all.
          # A run in `bvv-platform` therefore carries a `GITHUB_TOKEN` with no
          # permission on the first 6 — measured 2026-08-14, run 31823926618:
          #   ctr: failed to resolve image: unexpected status from HEAD request
          #   to .../tradefairs/service-desk/manifests/...: 403 Forbidden
          # while the `docker/login-action` PUSH in the build job of the SAME
          # run succeeded, because that one already uses `NPM_TOKEN` (L123).
          # Both sides use the identical `github.actor` username, so the actor
          # is excluded as the cause — the token is the only varying term.
          #
          # `NPM_TOKEN` is org-scoped, exists in all 14 caller repos, and is
          # already the fleet's ghcr credential everywhere else (app-ci.yml
          # L374, this file L123). It is also already placed on THIS runner in
          # THIS job by the `Apply manifests` step's `git config --global`
          # url-rewrite, so using it here adds no new secret exposure — it
          # removes an outlier instead. Standalone-repo callers are unaffected:
          # they were passing only because their run happened to live in the
          # package's linked repo, and `NPM_TOKEN` covers that case too.
          #
          # Rejected: making packages `public` (these are private business
          # apps); relinking each package to `bvv-platform` (no REST field
          # exists — `PATCH .../packages/container/<pkg>` 404s — and pushing
          # from the monorepo does not relink, verified: service-desk was
          # pushed from bvv-platform at 17:30 and stayed linked to
          # `service-desk`, so it would mean delete+recreate on 6 live
          # production images); flipping `private` → `internal` (widens read
          # access to the whole org to work around a credential bug).
          sudo k3s ctr -n k8s.io images pull \
            --user "${{ github.actor }}:${{ secrets.NPM_TOKEN }}" \
            "$IMAGE:$IMAGE_TAG"
          echo "Pulled into k3s containerd:"
          sudo k3s ctr -n k8s.io images ls -q | grep "${{ inputs.slug }}" | head -5

      - name: Set image tag in test overlay kustomization
        run: |
          # $OVERLAY_DIR is resolved above (infra-liv11 if migrated, app repo otherwise).
          #
          # NOTE: this previously tried `kubectl kustomize edit set image ... || sed`.
          # That command does not exist (`kubectl kustomize` takes a path, there is
          # no `edit` subcommand), so it ALWAYS failed and the `sed` fallback always
          # did the work. The dead half is removed rather than carried forward;
          # the sed is now asserted so a shape change fails loudly instead of
          # silently deploying whatever tag the overlay happened to carry.
          cd "$OVERLAY_DIR"
          if ! grep -q '^\s*newTag:' kustomization.yaml; then
            echo "::error::$OVERLAY_DIR/kustomization.yaml has no 'newTag:' line — cannot set image tag. Refusing to deploy."
            exit 1
          fi
          sed -i "s/newTag: .*/newTag: $IMAGE_TAG/" kustomization.yaml
          grep -q "newTag: $IMAGE_TAG" kustomization.yaml || {
            echo "::error::Failed to set newTag to $IMAGE_TAG in $OVERLAY_DIR/kustomization.yaml"
            exit 1
          }
          cat kustomization.yaml

      - name: Set image tag in refresh job ConfigMap
        run: |
          # Proc tenhle krok existuje (domereno proti clusteru 2026-09-01).
          #
          # `refresh-job-cm.yaml` nese SABLONU refresh Jobu, ktery spousti
          # bvv-test-admin pri prod->test kopii dat. Sablona mela natvrdo
          # `image: ghcr.io/tradefairs/<slug>:test` — plovouci tag.
          #
          # Tri veci dohromady delaly z toho tagu nefunkcni konstrukci:
          #
          #  1. Tag `:test` v containerd na liv11 NEEXISTUJE. Krok „Pull image
          #     into k3s containerd" vyse importuje vyhradne `$IMAGE:$IMAGE_TAG`,
          #     tedy verzovany tag. Merenim: `k3s ctr images ls -q | grep -c ':test'`
          #     vracelo 0, zatimco osm refresh CM ho pozadovalo.
          #  2. Kubelet by ho tedy musel tahnout z GHCR — jenze VSECHNY
          #     `ghcr-pull-secret` ve flotile jsou mrtve. Pet namespacu nese pet
          #     RUZNYCH tokenu a GHCR odmita kazdy z nich (403 Forbidden).
          #  3. Zbytek flotily to nebolelo, protoze na kubelet pull nespoleha:
          #     Deploymenty bezi verzovane tagy s `imagePullPolicy: IfNotPresent`
          #     nad image importovanym do containerd. Refresh Job byl JEDINY
          #     workload, ktery pull skutecne potreboval — proto tahle vada
          #     zustala roky neodhalena a projevila se az pri auditu.
          #
          # Reseni: dat CM tentyz verzovany tag, jaky dostal Deployment. Image
          # uz je po kroku vyse v containerd, takze `IfNotPresent` ho najde
          # lokalne a pull secret neni potreba vubec.
          #
          # PROC SED A NE kustomize `images:` transformer: transformer prepisuje
          # POLE `image` v pod specich, ale obsah ConfigMapy je pro nej
          # NEPRUHLEDNY RETEZEC. Overeno empiricky — render prepsal image
          # Deploymentu a tentyz image uvnitr `data:` nechal na `:test`.
          #
          # Krok je zamerne mekky (appka CM mit nemusi), ale jakmile soubor
          # existuje, je tvrdy: neprepsany tag = tise rozbity refresh, coz je
          # presne ten tichy rezim selhani, ktery tenhle krok odstranuje.
          CM="$OVERLAY_DIR/refresh-job-cm.yaml"
          if [ ! -f "$CM" ]; then
            echo "No refresh-job-cm.yaml in $OVERLAY_DIR — skipping (app has no prod→test refresh)."
            exit 0
          fi
          if ! grep -qE "^\s*image: $IMAGE:" "$CM"; then
            echo "::error::$CM has no 'image: $IMAGE:<tag>' line — refresh job template shape changed. Refusing to deploy."
            exit 1
          fi
          sed -i -E "s|^(\s*)image: $IMAGE:.*|\1image: $IMAGE:$IMAGE_TAG|" "$CM"
          if ! grep -q "image: $IMAGE:$IMAGE_TAG" "$CM"; then
            echo "::error::Failed to set refresh job image to $IMAGE:$IMAGE_TAG in $CM"
            exit 1
          fi
          echo "Refresh job image set to:"
          grep -nE "^\s*image: " "$CM"

      - name: Decrypt and apply SOPS secret (if migrated)
        # ADR-082 (amends ADR-013): SOPS material is cluster-specific config and
        # lives in `infra-<cluster>`, at
        # `environments/{prod,test}/<app>/secrets.enc.yaml`, with `.sops.yaml` per
        # ENVIRONMENT (not per repo) so each environment has its own age key.
        # TD-841 rework 2026-08-24: the originally shipped step read
        # `$K8S_DIR/overlays/test/secrets.enc.yaml`, a path relative to the
        # CALLING app repo's checkout — infra-liv11 is never in that checkout
        # (this job consumes it only as a remote kustomize base). With the secret
        # in infra-liv11 that `-f` test is simply false, so the step took the
        # skip branch and the deploy went green having applied NO Secret. Hence
        # the dedicated `.infra-liv11` checkout above and the infra-first
        # resolution below.
        #
        # PLAN-250 wave 1 je dokončená, takže infra-liv11 je jediný zdroj:
        # legacy app-repo cesta byla zrušena (cattle-not-pets fáze 5, 2026-08-30).
        #
        # Gated purely on file presence. Placed BEFORE "Run DB migrations" AND
        # "Apply manifests" — both the migrate Job and the Deployment reference
        # this Secret via envFrom. Drill fáze 7 (2026-08-30, gis-dms/test
        # rebuild-from-git) caught the original ordering (Secret applied only
        # before "Apply manifests", after migrations): a namespace with no PRIOR
        # live Secret — the exact case a fresh rebuild produces — made the
        # migrate Job fail immediately with `CreateContainerConfigError: secret
        # "gis-dms-env-test" not found`. Every earlier deploy had a Secret
        # already live from a previous run, so this never surfaced before. For
        # apps that haven't migrated yet NEITHER file exists, so this step is a
        # clean no-op: today's manual Secret-application deploy behavior is
        # completely unchanged for them.
        #
        # No `SOPS_AGE_KEY_FILE` pinning and no `--age`/recipient flag: `sops -d`
        # selects the private key by matching the file's own recipients against
        # the keys available to the runner. Pinning a key here would silently
        # defeat the per-environment key separation ADR-082 requires.
        run: |
          # `pipefail` so a failing `sops -d` (wrong/absent key) fails the STEP.
          # Without it the pipeline's exit status is `kubectl apply`'s, which
          # happily succeeds on empty stdin — i.e. "secret not applied" would be
          # another silent green. See TD-841 R4.
          set -o pipefail
          SECRET_DIR=".infra-liv11/environments/test/${{ inputs.slug }}"
          # Aplikuje se KAŽDÝ `*.enc.yaml` v adresáři appky, ne jen
          # `secrets.enc.yaml` (cattle-not-pets fáze 7, 2026-08-31). Důvod:
          # appka může mít víc než jeden SOPS Secret a hardkódovaná jediná
          # cesta by ty ostatní tiše ignorovala. Konkrétně `jira-status` má
          # navíc `migrator-secret.enc.yaml` (credential pro `db-migrate`
          # initContainer) a `jira-status-web` má `prod-readonly-secret.enc.yaml`
          # (její JEDINÝ zdroj DATABASE_URL). Obojí byly do té doby
          # cluster-side pets, které by po `delete ns` nešly obnovit z gitu —
          # a hardkódovaná cesta byla poslední důvod, proč je tam držet.
          #
          # Řazení přes `sort` je záměrné: bez něj závisí pořadí applyů na
          # pořadí globu, což je sice v praxi abecední, ale nespecifikované.
          # Soubory cílí na různé Secrety, takže na pořadí nezáleží — ale
          # deterministický log se čte líp než náhodný.
          shopt -s nullglob
          files=$(printf '%s\n' "$SECRET_DIR"/*.enc.yaml | sort)
          if [ -z "$files" ]; then
            echo "::notice::No *.enc.yaml in $SECRET_DIR — app not yet migrated to SOPS, skipping (manual secret application unchanged)"
          else
            # Explicitní `|| exit 1`: `set -o pipefail` sám o sobě NESTAČÍ,
            # protože exit status jedné iterace cyklus zahodí a krok skončí
            # statusem POSLEDNÍ iterace. Selhání kteréhokoli dřívějšího
            # souboru by tedy bylo přesně to "tiché zelené", před kterým
            # varuje komentář výš (TD-841/842 R4). Naměřeno, ne odhadnuto.
            for SECRET_FILE in $files; do
              echo "Applying SOPS secret from $SECRET_FILE"
              sops -d "$SECRET_FILE" | sudo kubectl apply -n "$NS" -f - || {
                echo "::error::apply $SECRET_FILE selhal"
                exit 1
              }
            done
          fi

      - name: Apply plaintext config (if migrated)
        # Design doc `config-as-code-target-state` (platform-workspace
        # docs/design/): non-secret env-bound values live NEXT TO the SOPS
        # material as a plain ConfigMap manifest — plaintext in git, so
        # `git log -p` answers "when did SYNC_CRON change". A key lives in
        # exactly ONE of config.yaml / secrets.enc.yaml, never both. Gated
        # purely on file presence; placed BEFORE "Run DB migrations" and "Apply
        # manifests" for the same reason as the Secret above (both the migrate
        # Job's and the Deployment's envFrom/configMapRef must resolve). The
        # Deployment's configMapRef is `optional: true`, so un-migrated
        # environments of a migrated app keep working — this skip is a no-op.
        run: |
          INFRA_CONFIG=".infra-liv11/environments/test/${{ inputs.slug }}/config.yaml"
          if [ -f "$INFRA_CONFIG" ]; then
            echo "Applying plaintext config from $INFRA_CONFIG"
            sudo kubectl apply -n "$NS" -f "$INFRA_CONFIG"
          else
            echo "::notice::No config.yaml at $INFRA_CONFIG — skipping (no plaintext config for this app/env)"
          fi

      - name: Run DB migrations (pre-deploy Job)
        run: |
          # TD-821: the skip below is only legitimate for a RESOLVED path. Before
          # TD-821 the guard was a bare `[ ! -f k8s/job-migrate.yaml ]`, which at
          # a monorepo repo root is ALWAYS true — so the 11 apps already calling
          # this workflow with `appPath: apps/<slug>` from `deploy-affected.yml`
          # would skip every migration silently and green. The two cases are now
          # distinguishable:
          #   - `$K8S_DIR` exists but has no `job-migrate.yaml` → genuinely
          #     stateless app (6 of 13 have no migration manifest) → skip, as today.
          #   - `$K8S_DIR` does not exist at all → `appPath` is unresolvable →
          #     hard fail, never a green skip.
          # 2026-08-29: the guard now tests `$APP_PATH`, not `$K8S_DIR`. The
          # premise above — "single-app repos always have a `k8s/` directory (it
          # is where the test overlay just read from)" — died when the overlays
          # moved to infra-liv11/environments/. For an app whose `k8s/` held ONLY
          # `overlays/` (jira-status-web, bvv-portal) the directory vanished with
          # the overlay, and this guard hard-failed a deploy that should have
          # skipped: both are stateless, with no `base/` and no `job-migrate.yaml`.
          # `$APP_PATH` is what the error message was always really asserting
          # about ("does not resolve to an app directory"), so test that directly.
          # Empty `appPath` → repo root → always exists → single-app repos
          # unchanged. A missing `k8s/` now falls through to the stateless skip
          # below, which is the correct outcome: no manifest, no migration.
          if [ -n "$APP_PATH" ] && [ ! -d "$APP_PATH" ]; then
            echo "::error::$APP_PATH does not exist — appPath='${APP_PATH}' does not resolve to an app directory in this repo. Refusing to skip migrations silently."
            exit 1
          fi
          # Optional: stateless apps (e.g. bvv-directory-web) have no k8s/job-migrate.yaml.
          if [ ! -f "$K8S_DIR/job-migrate.yaml" ]; then
            echo "::notice::$K8S_DIR/job-migrate.yaml not present — stateless app, skipping migrations"
            exit 0
          fi
          SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-12)
          JOB_NAME="${{ inputs.slug }}-migrate-${SHORT_SHA}"
          sudo kubectl -n "$NS" delete job "$JOB_NAME" --ignore-not-found
          # Strip any hardcoded `namespace:` from the manifest — applied with -n "$NS";
          # a stray (often stale prod) namespace line would conflict with the flag.
          sed "s|__JOB_NAME__|${JOB_NAME}|g; s|__IMAGE_TAG__|${IMAGE_TAG}|g; s|name: ${{ inputs.slug }}-env|name: ${{ inputs.slug }}-env-test|g; /^[[:space:]]*namespace:[[:space:]]/d" "$K8S_DIR/job-migrate.yaml" \
            | sudo kubectl apply -n "$NS" -f -
          set +e
          sudo kubectl -n "$NS" wait --for=condition=complete --timeout=300s "job/$JOB_NAME"
          COMPLETE=$?
          if [ $COMPLETE -ne 0 ]; then
            echo "::error::Migration Job did not complete successfully"
            sudo kubectl -n "$NS" describe "job/$JOB_NAME" || true
            sudo kubectl -n "$NS" logs --tail=200 "job/$JOB_NAME" || true
            exit 1
          fi
          set -e

      - name: Apply manifests
        env:
          LOAD_RESTRICTOR: ${{ inputs.loadRestrictor }}
        run: |
          # The overlay pulls a remote kustomize base from the PRIVATE
          # TradeFairs/infra-liv11 repo. The runner's sudoers only allows passwordless
          # `sudo kubectl` (not `sudo git`), and `kubectl apply -k` under sudo would
          # fetch as root (no creds → timeout). So: RENDER as the runner user (with
          # an NPM_TOKEN url-rewrite in the runner user's git config — no sudo, no
          # cluster access needed for `kubectl kustomize`), then `sudo kubectl apply`
          # the static rendered manifests.
          # The url-rewrite is only needed while an overlay still pulls k8s-base as a
          # REMOTE component. A migrated overlay lives inside the .infra-liv11 checkout
          # and references k8s-base by local path, so its render is offline — the
          # rewrite is then a harmless no-op (kept until the last app is migrated).
          git config --global url."https://x-access-token:${{ secrets.NPM_TOKEN }}@github.com/".insteadOf "https://github.com/"
          # $OVERLAY_DIR is resolved above (infra-liv11 if migrated, app repo otherwise).
          # LOAD_RESTRICTOR is empty for every app except those whose base loads files
          # from outside k8s/ (jira-status: configMapGenerator on ../../notification_rules.yaml).
          kubectl kustomize ${LOAD_RESTRICTOR:-} "$OVERLAY_DIR/" > /tmp/${{ inputs.slug }}-manifests.yaml
          sudo kubectl apply -f /tmp/${{ inputs.slug }}-manifests.yaml
          # PoC (PLAN-107): NO `rollout restart`. `apply` with the new immutable image
          # tag already triggers a clean single-generation rollout. The extra restart
          # added a second generation → `rollout status` and the pod poll disagreed
          # ("rollout succeeded" yet a pod looked like old image). One generation =
          # `rollout status` is authoritative.

      - name: Wait for rollout (with retry)
        run: |
          set +e
          APP=${{ inputs.slug }}
          for attempt in 1 2 3; do
            if sudo kubectl rollout status deployment/$APP -n "$NS" --timeout=120s; then
              echo "Rollout succeeded on attempt $attempt"
              exit 0
            fi
            if [ $attempt -lt 3 ]; then
              echo "::warning::Rollout attempt $attempt failed, force-deleting stuck Terminating pods..."
              STUCK=$(sudo kubectl get pods -n "$NS" -l app=$APP --no-headers 2>/dev/null | awk '$3 == "Terminating" {print $1}')
              if [ -n "$STUCK" ]; then
                echo "Stuck Terminating pods: $STUCK"
                echo "$STUCK" | xargs -r sudo kubectl delete pod -n "$NS" --force --grace-period=0 || true
              else
                echo "No stuck Terminating pods found"
              fi
              sleep 5
            fi
          done
          echo "::error::Rollout failed after 3 attempts"
          exit 1

      - name: Verify deployment spec image (non-racy)
        run: |
          # PoC (PLAN-107): the racy "non-terminating pod still on old image" poll is
          # REMOVED. Rollout COMPLETION is owned by `rollout status` above (it already
          # waits for new RS available + old RS scaled to 0 — i.e. only new-image pods
          # remain). Rollout CORRECTNESS is confirmed by the version-asserting smoke
          # below (the running app self-reports its built version via /api/version) —
          # a direct signal that doesn't race surge pods on a slow node. Here we keep
          # only a cheap, non-racy assertion that the Deployment SPEC carries the
          # expected image.
          EXPECTED="$IMAGE:$IMAGE_TAG"
          DEPLOY_IMG=$(sudo kubectl get deployment ${{ inputs.slug }} -n "$NS" \
            -o jsonpath='{.spec.template.spec.containers[0].image}')
          echo "Deployment spec image: $DEPLOY_IMG (expected: $EXPECTED)"
          [ "$DEPLOY_IMG" != "$EXPECTED" ] && { echo "::error::Deployment spec image mismatch"; exit 1; }
          echo "::notice::Spec verified. Completion=rollout status, correctness=version smoke."

      - name: Smoke test ${{ inputs.basePath }}/api/version
        if: inputs.smokeMode == 'ingress'
        run: |
          sleep 10
          RESPONSE=$(curl -fsSk --noproxy 'test-liv11.brno.bvv.cz,liv11.brno.bvv.cz' \
            https://test-liv11.brno.bvv.cz${{ inputs.basePath }}/api/version)
          echo "Response: $RESPONSE"
          # Assert version field matches the SNAPSHOT version we built
          EXPECTED_VER="${{ needs.build.outputs.version }}"
          python3 -c "
          import sys, json
          data = json.load(sys.stdin)
          got = data.get('version', '')
          expected = '$EXPECTED_VER'
          assert got == expected, f'Version mismatch: got={got!r} expected={expected!r}'
          env = data.get('environment', '')
          assert env == 'test', f'Expected environment=test, got={env!r}'
          print(f'PASS: test-liv11.brno.bvv.cz${{ inputs.basePath }}/api/version returned version={got!r} environment={env!r}')
          " <<< "$RESPONSE"

      - name: Smoke test ${{ inputs.basePath }}/api/version (cluster-internal via port-forward)
        # smokeMode=port-forward (TD-224, ADR-045 api-internal profile): the app has
        # no public IngressRoute (ADR-020 security boundary), so the smoke goes
        # through kubectl port-forward to the Service. Procedure taken verbatim
        # from the inline bvv-directory-api deploy-test.yml (incl. PF cleanup).
        if: inputs.smokeMode == 'port-forward'
        run: |
          sleep 10
          sudo kubectl port-forward -n "$NS" svc/${{ inputs.slug }} 19891:3000 &
          PF_PID=$!
          sleep 3
          RESPONSE=$(curl -fsSk \
            --retry 3 --retry-delay 5 --retry-all-errors \
            --max-time 10 \
            http://127.0.0.1:19891${{ inputs.basePath }}/api/version)
          kill $PF_PID 2>/dev/null || true
          echo "Response: $RESPONSE"
          EXPECTED_VER="${{ needs.build.outputs.version }}"
          python3 -c "
          import sys, json
          data = json.load(sys.stdin)
          got = data.get('version', '')
          expected = '$EXPECTED_VER'
          assert got == expected, f'Version mismatch: got={got!r} expected={expected!r}'
          env = data.get('environment', '')
          assert env == 'test', f'Expected environment=test, got={env!r}'
          print(f'PASS: /api/version returned version={got!r} environment={env!r}')
          " <<< "$RESPONSE"

      - name: Debug pod status (always)
        if: always()
        run: |
          echo "=== Pods ==="
          sudo kubectl get pods -n "$NS" -o wide
          echo "=== Events ==="
          sudo kubectl get events -n "$NS" --sort-by='.lastTimestamp' | tail -20
          echo "=== Pod logs ==="
          POD=$(sudo kubectl get pods -n "$NS" -l app=${{ inputs.slug }} \
            -o jsonpath='{.items[0].metadata.name}' 2>/dev/null)
          [ -n "$POD" ] && sudo kubectl logs -n "$NS" "$POD" --tail=30 2>&1 || echo "no pod logs"
