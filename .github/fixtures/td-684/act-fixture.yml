# TD-684 act fixture — NOT a real workflow_call caller, not wired into `on:`
# triggers, never runs in CI. Local-only proof for `act`, run explicitly via
# `scripts/test-promotion-act-fixture.sh`. Exercises the "Resolve PR image"
# step's require_pr_image branching against a mocked `gh` + `docker` (no
# registry/GHCR/network access needed), covering:
#   - false (default) + PR image found         -> image_found=true  (promote)
#   - false (default) + no PR (direct push)     -> image_found=false (fallback, unchanged)
#   - true             + no PR (direct push)    -> hard fail, exit 1
#   - true             + PR image found         -> image_found=true  (promote, no fallback reachable)
name: TD-684 promotion contract (act fixture, local-only)

on:
  workflow_dispatch:

jobs:
  resolve-pr-image:
    strategy:
      fail-fast: false
      matrix:
        scenario:
          - name: default-false-image-found
            require_pr_image: 'false'
            mock_pr_sha: 'abc1234'
            mock_image_found: 'true'
            expect: image_found=true
          - name: default-false-no-pr
            require_pr_image: 'false'
            mock_pr_sha: ''
            mock_image_found: 'false'
            expect: image_found=false (fallback, fail-open unchanged)
          - name: true-no-pr-hard-fail
            require_pr_image: 'true'
            mock_pr_sha: ''
            mock_image_found: 'false'
            expect: job fails, no fallback
          - name: true-image-found
            require_pr_image: 'true'
            mock_pr_sha: 'def5678'
            mock_image_found: 'true'
            expect: image_found=true (promote, no fallback reachable)
    runs-on: ubuntu-latest
    env:
      REQUIRE_PR_IMAGE: ${{ matrix.scenario.require_pr_image }}
      MOCK_PR_SHA: ${{ matrix.scenario.mock_pr_sha }}
      MOCK_IMAGE_FOUND: ${{ matrix.scenario.mock_image_found }}
    steps:
      - name: Install mock gh + docker on PATH
        run: |
          mkdir -p /tmp/mockbin
          cat > /tmp/mockbin/gh <<'EOF'
          #!/bin/bash
          # Mocks: gh api repos/.../commits/<sha>/pulls --jq '.[0].head.sha // ""'
          echo "$MOCK_PR_SHA"
          exit 0
          EOF
          cat > /tmp/mockbin/docker <<'EOF'
          #!/bin/bash
          # Mocks: docker buildx imagetools inspect <ref>
          if [ "$MOCK_IMAGE_FOUND" = "true" ]; then exit 0; else exit 1; fi
          EOF
          chmod +x /tmp/mockbin/gh /tmp/mockbin/docker
          echo "/tmp/mockbin" >> "$GITHUB_PATH"

      # Verbatim body of app-deploy-test.yml's "Resolve PR image" step
      # (TD-684), kept in sync by scripts/test-promotion-act-fixture.sh,
      # which diffs this block against the real workflow file before
      # invoking act — any drift fails the fixture run before act starts.
      - name: Resolve PR image (ADR-034 — promote instead of rebuild)
        id: pr_image
        env:
          GH_TOKEN: mock-token
          REQUIRE_PR_IMAGE: ${{ matrix.scenario.require_pr_image }}
        run: |
          if ! PR_SHA=$(gh api "repos/mock/mock/commits/mocksha/pulls" --jq '.[0].head.sha // ""' 2>/dev/null); then
            if [ "$REQUIRE_PR_IMAGE" = "true" ]; then
              echo "::error::require_pr_image=true: gh api commits/<sha>/pulls failed (permissions/transient) — refusing to fall back to rebuild"
              exit 1
            fi
            echo "::warning::gh api commits/<sha>/pulls failed (permissions/transient) — falling back to rebuild"
            echo "image_found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "$PR_SHA" ]; then
            if [ "$REQUIRE_PR_IMAGE" = "true" ]; then
              echo "::error::require_pr_image=true: no PR associated with merge mocksha (direct push?) — refusing to fall back to rebuild"
              exit 1
            fi
            echo "No PR associated with merge mocksha (direct push?). Falling back to rebuild."
            echo "image_found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Resolved PR head SHA: $PR_SHA"
          echo "pr_sha=$PR_SHA" >> "$GITHUB_OUTPUT"
          if docker buildx imagetools inspect "ghcr.io/tradefairs/mockapp:pr-$PR_SHA" >/dev/null 2>&1; then
            echo "image_found=true" >> "$GITHUB_OUTPUT"
          else
            if [ "$REQUIRE_PR_IMAGE" = "true" ]; then
              echo "::error::require_pr_image=true: ghcr.io/tradefairs/mockapp:pr-$PR_SHA not found — refusing to fall back to rebuild"
              exit 1
            fi
            echo "::warning::ghcr.io/tradefairs/mockapp:pr-$PR_SHA not found; will rebuild"
            echo "image_found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Assert no fallback build is reachable (docker/build-push-action never invoked)
        run: |
          # Static proof, not an executed step: `docker/build-push-action` is a
          # separate job step in the real workflow (`if: image_found != 'true'`),
          # never invoked here. This fixture job has no such step at all, so
          # its mere absence — checked below — is the assertion.
          echo "No docker/build-push-action step present in this job (see workflow source)."

      - name: Report outcome
        if: always()
        run: |
          echo "Scenario: ${{ matrix.scenario.name }}"
          echo "Expected: ${{ matrix.scenario.expect }}"
          echo "image_found output: ${{ steps.pr_image.outputs.image_found }}"
          echo "pr_sha output: ${{ steps.pr_image.outputs.pr_sha }}"
