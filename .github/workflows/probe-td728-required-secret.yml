# Disposable scratch probe (k8s-workspace:TD-728) — NOT for merging.
# Minimal reusable workflow: workflow_call declares a required secret,
# does nothing else (no cross-repo checkout, no other complexity), to
# isolate whether GitHub Actions' handling of a required workflow_call
# secret is itself the cause of the zero-jobs-scheduled failure observed
# calling app-adr073-verdict-gate.yml from bvv-platform, independent of
# the k8s-workspace cross-repo checkout step.
on:
  workflow_call:
    secrets:
      NPM_TOKEN:
        required: true
        description: Probe secret, mirrors app-adr073-verdict-gate.yml's shape.

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: echo "probe ran, secret length ${#NPM_TOKEN}"
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
