# app-ci.yml — reusable CI workflow: lint, typecheck, unit tests, build (ADR-023 §K.1).
# No Docker build, no deploy. GitHub-hosted runner (no self-hosted needed).
# Callers: TradeFairs/<app>/.github/workflows/ci.yml  (uses: TradeFairs/.github/.github/workflows/app-ci.yml@main)
name: App CI (reusable)

on:
  workflow_call:
    inputs:
      slug:
        required: true
        type: string
      basePath:
        required: true
        type: string

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ${{ inputs.slug }}
          POSTGRES_PASSWORD: dev
          POSTGRES_DB: ${{ inputs.slug }}
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: pnpm/action-setup@v4
        with: { version: 10 }

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: '@tradefairs'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            ${{ github.workspace }}/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/pnpm-lock.yaml') }}-${{ hashFiles('**/*.[jt]s', '**/*.[jt]sx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/pnpm-lock.yaml') }}-

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Guard against hardcoded basePath literals
        # ADR-024 §G — CI fails if any source file contains a hardcoded basePath literal.
        run: |
          if grep -rn "['\"]\\${{ inputs.basePath }}['\"]" src --include='*.ts*' --exclude-dir=__tests__ 2>/dev/null; then
            echo "::error::Hardcoded basePath literal found in src/. Use APP_BASE_PATH env per ADR-024."
            exit 1
          fi

      - name: Build (verify bundle compiles)
        run: pnpm build
        env:
          APP_BASE_PATH: ${{ inputs.basePath }}
          NEXT_PUBLIC_APP_BASE_PATH: ${{ inputs.basePath }}
          NEXT_PUBLIC_BVV_ENV: test
          NEXT_PUBLIC_APP_VERSION: 0.0.0-ci
          APP_GIT_COMMIT: ${{ github.sha }}
          APP_BUILD_TIME: "1970-01-01T00:00:00Z"
          AUTH_SECRET: ci-only-not-a-real-secret-${{ github.sha }}
          AUTH_URL: http://localhost:3000
          AUTH_KEYCLOAK_ID: ci
          AUTH_KEYCLOAK_SECRET: ci
          AUTH_KEYCLOAK_ISSUER: http://localhost/realms/ci
          DATABASE_URL: postgres://${{ inputs.slug }}:dev@localhost:5432/${{ inputs.slug }}
          DIRECTORY_API_URL: http://localhost:3001/api
          DIRECTORY_API_CLIENT_ID: ci
          DIRECTORY_API_CLIENT_SECRET: ci-secret
          APP_PUBLIC_BASE_URL: http://localhost:3000${{ inputs.basePath }}
