# app-deploy-test.yml — reusable deploy-to-test workflow (ADR-023 §K.2).
# build job runs on GitHub-hosted runner (internet access for ghcr.io push).
# deploy job runs on self-hosted runner (direct kubectl access to k3s on liv11).
# Callers: TradeFairs/<app>/.github/workflows/deploy-test.yml (uses: TradeFairs/.github/.github/workflows/app-deploy-test.yml@main)
name: App Deploy to test (reusable)

on:
  workflow_call:
    inputs:
      slug:
        required: true
        type: string
      basePath:
        required: true
        type: string
      # ── Optional profile knobs (TD-224 / PLAN-131 / ADR-045) ─────────────────
      smokeMode:
        description: >-
          Smoke-test transport: ingress (default — public
          https://test-liv11.brno.bvv.cz<basePath>/api/version) | port-forward
          (kubectl port-forward to the Service + curl via localhost, for
          cluster-internal apps without an IngressRoute — ADR-020 security
          boundary, ADR-045 api-internal profile, e.g. bvv-directory-api).
        type: string
        default: ingress
      ciRunsOn:
        description: >-
          JSON array (as a string) of runner labels for the `build` job,
          consumed via `fromJSON(inputs.ciRunsOn)` (TD-273 / ADR-047 §C).
          Default is a no-op — every existing caller keeps building on
          GitHub-hosted `ubuntu-latest` until it opts in (e.g.
          '["self-hosted","liv26"]'). The `deploy` job is unaffected — it
          stays pinned to the literal `[self-hosted, liv11]` label.
        type: string
        default: '"ubuntu-latest"'
      appPath:
        description: >-
          Monorepo-relative path (e.g. `apps/<slug>`) to read the version for
          the image tag / smoke assertion from, instead of the repo-root
          `package.json` (TD-625 / ADR-071 §12.1 — the monorepo root version
          has no meaning and nothing may be derived from it). Default is a
          no-op empty string: every existing standalone-repo caller keeps
          reading its own repo-root `package.json` unchanged (Acceptance
          Criterion 6) until it opts in from inside the future consolidated
          `bvv-platform` monorepo (ADR-071 step 4+, not in scope here).
        type: string
        default: ''

concurrency:
  group: deploy-${{ inputs.slug }}
  cancel-in-progress: false  # never cancel a running deploy mid-rollout

permissions:
  contents: read
  packages: write
  pull-requests: read  # ADR-034 "Resolve PR image" calls gh api .../commits/<sha>/pulls

jobs:
  # ── 1. Build & push image ────────────────────────────────────────────────────
  build:
    runs-on: ${{ fromJSON(inputs.ciRunsOn) }}
    env:
      IMAGE: ghcr.io/tradefairs/${{ inputs.slug }}
    outputs:
      version: ${{ steps.version.outputs.version }}
      image_tag: ${{ steps.version.outputs.image_tag }}

    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute buildx driver-opts + build-args (self-hosted proxy passthrough)
        # TD-280: see app-ci.yml for the full rationale — the buildx
        # docker-container driver's builder doesn't inherit this job's proxy
        # env, so forward it dynamically (empty on ubuntu-latest, no-op there).
        # TD-281: Dockerfile RUN steps (pnpm/npm install) need the same values
        # as build-args instead (Docker's predefined ARGs — no Dockerfile
        # `ARG` declaration needed).
        # TD-282: force the classic `docker` driver on self-hosted so cache is
        # genuinely shared (see app-ci.yml for the full rationale — the
        # docker-container driver's per-job throwaway builder never persisted
        # cache across jobs/runners).
        id: buildx_opts
        shell: bash
        run: |
          # opts<<EOF/EOF and build_args<<EOF/EOF below are safe only because
          # HTTP_PROXY/HTTPS_PROXY are operator-set proxy URLs, never
          # untrusted input.
          {
            if [ -n "${HTTP_PROXY:-}" ]; then echo "env.HTTP_PROXY=${HTTP_PROXY}"; fi
            if [ -n "${HTTPS_PROXY:-}" ]; then echo "env.HTTPS_PROXY=${HTTPS_PROXY}"; fi
          } > /tmp/buildx-driver-opts.txt
          {
            if [ -n "${HTTP_PROXY:-}" ]; then echo "HTTP_PROXY=${HTTP_PROXY}"; fi
            if [ -n "${HTTPS_PROXY:-}" ]; then echo "HTTPS_PROXY=${HTTPS_PROXY}"; fi
          } > /tmp/buildx-build-args.txt
          {
            echo 'opts<<EOF'
            cat /tmp/buildx-driver-opts.txt
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
          {
            echo 'build_args<<EOF'
            cat /tmp/buildx-build-args.txt
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
          if [ -n "${HTTP_PROXY:-}" ]; then
            echo "driver=docker" >> "$GITHUB_OUTPUT"
          else
            echo "driver=" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@v4
        with:
          driver: ${{ steps.buildx_opts.outputs.driver }}
          driver-opts: ${{ steps.buildx_opts.outputs.driver == '' && steps.buildx_opts.outputs.opts || '' }}

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.NPM_TOKEN }}

      - name: Resolve PR image (ADR-034 — promote instead of rebuild)
        id: pr_image
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Find the PR merged into this commit; its head SHA is the :pr-<sha> tag
          # ci.yml (app-ci.yml@v2) built. On merge we retag that image — no rebuild.
          # Resilient (ADR-034 "never fail closed"): if the API call fails (missing
          # pull-requests:read, transient 5xx), degrade to fallback rebuild, don't abort.
          if ! PR_SHA=$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/pulls" --jq '.[0].head.sha // ""' 2>/dev/null); then
            echo "::warning::gh api commits/<sha>/pulls failed (permissions/transient) — falling back to rebuild"
            echo "image_found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "$PR_SHA" ]; then
            echo "No PR associated with merge ${{ github.sha }} (direct push?). Falling back to rebuild."
            echo "image_found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Resolved PR head SHA: $PR_SHA"
          echo "pr_sha=$PR_SHA" >> "$GITHUB_OUTPUT"
          if docker buildx imagetools inspect "ghcr.io/tradefairs/${{ inputs.slug }}:pr-$PR_SHA" >/dev/null 2>&1; then
            echo "image_found=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::ghcr.io/tradefairs/${{ inputs.slug }}:pr-$PR_SHA not found; will rebuild"
            echo "image_found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Read version from package.json
        id: version
        env:
          APP_PATH: ${{ inputs.appPath }}
        run: |
          # TD-625 / ADR-071 §12.1: when appPath is set (future monorepo caller only —
          # every one of today's 13 standalone-repo callers leaves it unset), read the
          # version from apps/<slug>/package.json instead of the repo-root package.json;
          # the monorepo root version has no meaning and nothing may be derived from it.
          # Default (empty APP_PATH) preserves today's exact repo-root-relative command
          # unchanged, so this branch is a no-op for all existing callers.
          if [ -n "$APP_PATH" ]; then
            VERSION=$(node -p "require('./${APP_PATH}/package.json').version")
          else
            VERSION=$(node -p "require('./package.json').version")
          fi
          # Pre-flight: main must always be in SNAPSHOT state (ADR-023 §B.2).
          if [[ "$VERSION" != *-SNAPSHOT ]]; then
            echo "::error::package.json version '$VERSION' does not end with -SNAPSHOT."
            echo "::error::main branch must always be in SNAPSHOT state. Run the release"
            echo "::error::workflow to bump after a release, or fix package.json manually."
            exit 1
          fi
          SHORT_SHA="${GITHUB_SHA::7}"
          IMAGE_TAG="${VERSION}-test-${SHORT_SHA}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "image_tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION  Image tag: $IMAGE_TAG"

      - name: Promote PR image (retag, no rebuild)
        if: steps.pr_image.outputs.image_found == 'true'
        env:
          IMAGE: ghcr.io/tradefairs/${{ inputs.slug }}
          PR_SHA: ${{ steps.pr_image.outputs.pr_sha }}
          IMAGE_TAG: ${{ steps.version.outputs.image_tag }}
        run: |
          docker buildx imagetools create -t "$IMAGE:$IMAGE_TAG" -t "$IMAGE:test" "$IMAGE:pr-$PR_SHA"
          echo "Promoted $IMAGE:pr-$PR_SHA → $IMAGE:$IMAGE_TAG and :test"

      - name: Build and push test image (fallback — no PR image found)
        if: steps.pr_image.outputs.image_found != 'true'
        uses: docker/build-push-action@v7
        with:
          # TD-821: the DOCKERFILE follows `appPath`; the BUILD CONTEXT does not
          # and must stay the repo root. This asymmetry is measured, not assumed:
          # every one of the 13 apps' Dockerfiles is written root-context-relative
          # (54 `COPY packages/<pkg>/package.json`, `COPY apps/<slug>/…` and
          # `COPY pnpm-workspace.yaml` lines apiece — the pnpm workspace siblings
          # live OUTSIDE `apps/<slug>`). Narrowing the context to `apps/<slug>`
          # was tried in v2.4.0 and fails at `COPY`:
          #   failed to calculate checksum of ref …: "/packages/ui/package.json": not found
          # (`bvv-platform` run 31822241715). So only `file:` is threaded.
          #
          # `file` is a PROVEN no-op when empty, in the action's own source
          # (v7 = docker/build-push-action src/context.ts): it is emitted only
          # under `if (inputs.file)`, so an empty string appends no `--file` flag
          # at all, and `action.yml` gives it no default. Every existing
          # standalone-repo caller therefore runs the byte-identical buildx
          # command it runs today. This is the fix for the live failure in
          # `bvv-platform`'s `deploy-affected.yml`, which already passes
          # `appPath: apps/<slug>` for 11 apps and whose every build job failed
          # with `failed to read dockerfile: open Dockerfile: no such file or
          # directory`. `context:` is deliberately NOT set — today's default
          # context is already correct for both cases.
          file: ${{ inputs.appPath != '' && format('{0}/Dockerfile', inputs.appPath) || '' }}
          push: true
          secrets: |
            NPM_TOKEN=${{ secrets.NPM_TOKEN }}
          build-args: |
            APP_BASE_PATH=${{ inputs.basePath }}
            NEXT_PUBLIC_APP_BASE_PATH=${{ inputs.basePath }}
            NEXT_PUBLIC_BVV_ENV=test
            NEXT_PUBLIC_APP_VERSION=${{ steps.version.outputs.version }}
            APP_GIT_COMMIT=${{ github.sha }}
            APP_BUILD_TIME=${{ fromJSON(toJSON(github.event.head_commit.timestamp)) }}
            ${{ steps.buildx_opts.outputs.build_args }}
          tags: |
            ghcr.io/tradefairs/${{ inputs.slug }}:${{ steps.version.outputs.image_tag }}
            ghcr.io/tradefairs/${{ inputs.slug }}:test
          cache-from: type=registry,ref=ghcr.io/tradefairs/${{ inputs.slug }}:buildcache
          cache-to: |
            type=registry,ref=ghcr.io/tradefairs/${{ inputs.slug }}:buildcache,mode=max
            type=inline

  # ── 2. Deploy to <slug>-test namespace ──────────────────────────────────────
  deploy:
    # Pin to the liv11 runner: this job needs sudo + direct kubectl/k3s access to
    # the liv11 cluster. The liv56-test-gate runner also carries the default
    # `self-hosted` label but has neither, so a bare `runs-on: self-hosted` could
    # land here and fail with `sudo: command not found`.
    runs-on: [self-hosted, liv11]
    needs: build
    env:
      IMAGE: ghcr.io/tradefairs/${{ inputs.slug }}
      IMAGE_TAG: ${{ needs.build.outputs.image_tag }}
      # TD-821: `deploy` is a SEPARATE job from `build`, and `appPath` was so far
      # only consumed by the build job's version step — hence re-declared here.
      APP_PATH: ${{ inputs.appPath }}
      # TD-821: repo-root-relative path to the app's `k8s/` directory. With the
      # default empty `appPath` this is the literal 'k8s' used today at all
      # test-overlay and job-migrate sites; a monorepo caller passing
      # `apps/service-desk` gets 'apps/service-desk/k8s'.
      K8S_DIR: ${{ inputs.appPath != '' && format('{0}/k8s', inputs.appPath) || 'k8s' }}

    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve test namespace from overlay
        # The kustomize `namespace:` directive in overlays/test is the canonical target
        # namespace — `kubectl apply -f` (below) honours it, so the verify/rollout steps
        # must use the SAME namespace, not assume slug+"-test". Today every app's test
        # overlay happens to use `<slug>-test`, but deriving it removes that latent
        # assumption. Falls back to `<slug>-test` when the overlay omits `namespace:`.
        #
        # TD-821: the overlay path follows `appPath` via K8S_DIR (empty appPath
        # → the literal `k8s/overlays/test/kustomization.yaml` read today).
        # This is also the single place that validates `appPath` resolves: the
        # test overlay is mandatory for every app, so if it is absent the path
        # is wrong and the deploy must fail LOUDLY here rather than let `awk`
        # return empty, silently fall back to `<slug>-test` and deploy an image
        # into a namespace whose manifests were never rendered.
        run: |
          if [ ! -f "$K8S_DIR/overlays/test/kustomization.yaml" ]; then
            echo "::error::$K8S_DIR/overlays/test/kustomization.yaml not found — appPath='${APP_PATH}' does not resolve to an app directory in this repo. Refusing to deploy."
            exit 1
          fi
          NS=$(awk '/^namespace:[[:space:]]/{print $2; exit}' "$K8S_DIR/overlays/test/kustomization.yaml")
          NS=${NS:-${{ inputs.slug }}-test}
          echo "NS=$NS" >> "$GITHUB_ENV"
          echo "Resolved test namespace from $K8S_DIR/overlays/test: $NS"

      - name: Free Docker disk space
        run: sudo docker system prune -f

      - name: Ensure k3s containerd proxy
        run: |
          DESIRED='HTTP_PROXY=http://bvvproxy.brno.bvv.cz:8080
          HTTPS_PROXY=http://bvvproxy.brno.bvv.cz:8080
          NO_PROXY=localhost,127.0.0.1,10.0.0.0/8,192.168.0.0/16,.svc,.cluster.local'
          ENV_FILE=/etc/systemd/system/k3s.service.env
          CURRENT=$(cat "$ENV_FILE" 2>/dev/null || true)
          if [ "$DESIRED" != "$CURRENT" ]; then
            echo "$DESIRED" | sudo tee "$ENV_FILE"
            sudo systemctl daemon-reload
            sudo systemctl restart k3s
            echo "k3s restarted. Waiting 15s..."
            sleep 15
          else
            echo "Proxy env unchanged, skipping k3s restart."
          fi
          sudo kubectl get nodes

      - name: Pull image into k3s containerd
        run: |
          sudo k3s ctr -n k8s.io images pull \
            --user "${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}" \
            "$IMAGE:$IMAGE_TAG"
          echo "Pulled into k3s containerd:"
          sudo k3s ctr -n k8s.io images ls -q | grep "${{ inputs.slug }}" | head -5

      - name: Run DB migrations (pre-deploy Job)
        run: |
          # TD-821: the skip below is only legitimate for a RESOLVED path. Before
          # TD-821 the guard was a bare `[ ! -f k8s/job-migrate.yaml ]`, which at
          # a monorepo repo root is ALWAYS true — so the 11 apps already calling
          # this workflow with `appPath: apps/<slug>` from `deploy-affected.yml`
          # would skip every migration silently and green. The two cases are now
          # distinguishable:
          #   - `$K8S_DIR` exists but has no `job-migrate.yaml` → genuinely
          #     stateless app (6 of 13 have no migration manifest) → skip, as today.
          #   - `$K8S_DIR` does not exist at all → `appPath` is unresolvable →
          #     hard fail, never a green skip.
          # With the default empty `appPath`, K8S_DIR is the literal `k8s` and
          # this reduces to exactly today's two outcomes: single-app repos always
          # have a `k8s/` directory (it is where the test overlay just read from,
          # one step earlier), so the directory check cannot newly fail for them.
          if [ ! -d "$K8S_DIR" ]; then
            echo "::error::$K8S_DIR does not exist — appPath='${APP_PATH}' does not resolve to an app directory in this repo. Refusing to skip migrations silently."
            exit 1
          fi
          # Optional: stateless apps (e.g. bvv-directory-web) have no k8s/job-migrate.yaml.
          if [ ! -f "$K8S_DIR/job-migrate.yaml" ]; then
            echo "::notice::$K8S_DIR/job-migrate.yaml not present — stateless app, skipping migrations"
            exit 0
          fi
          SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-12)
          JOB_NAME="${{ inputs.slug }}-migrate-${SHORT_SHA}"
          sudo kubectl -n "$NS" delete job "$JOB_NAME" --ignore-not-found
          # Strip any hardcoded `namespace:` from the manifest — applied with -n "$NS";
          # a stray (often stale prod) namespace line would conflict with the flag.
          sed "s|__JOB_NAME__|${JOB_NAME}|g; s|__IMAGE_TAG__|${IMAGE_TAG}|g; s|name: ${{ inputs.slug }}-env|name: ${{ inputs.slug }}-env-test|g; /^[[:space:]]*namespace:[[:space:]]/d" "$K8S_DIR/job-migrate.yaml" \
            | sudo kubectl apply -n "$NS" -f -
          set +e
          sudo kubectl -n "$NS" wait --for=condition=complete --timeout=300s "job/$JOB_NAME"
          COMPLETE=$?
          if [ $COMPLETE -ne 0 ]; then
            echo "::error::Migration Job did not complete successfully"
            sudo kubectl -n "$NS" describe "job/$JOB_NAME" || true
            sudo kubectl -n "$NS" logs --tail=200 "job/$JOB_NAME" || true
            exit 1
          fi
          set -e

      - name: Set image tag in test overlay kustomization
        run: |
          # TD-821: overlay path follows `appPath` via K8S_DIR — empty appPath
          # yields the literal `k8s/overlays/test` used today.
          cd "$K8S_DIR/overlays/test"
          sudo kubectl kustomize edit set image ghcr.io/tradefairs/${{ inputs.slug }}=ghcr.io/tradefairs/${{ inputs.slug }}:$IMAGE_TAG 2>/dev/null || \
            sed -i "s/newTag: .*/newTag: $IMAGE_TAG/" kustomization.yaml
          cat kustomization.yaml

      - name: Apply manifests
        run: |
          # The overlay pulls a remote kustomize base from the PRIVATE
          # TradeFairs/infra-liv11 repo. The runner's sudoers only allows passwordless
          # `sudo kubectl` (not `sudo git`), and `kubectl apply -k` under sudo would
          # fetch as root (no creds → timeout). So: RENDER as the runner user (with
          # an NPM_TOKEN url-rewrite in the runner user's git config — no sudo, no
          # cluster access needed for `kubectl kustomize`), then `sudo kubectl apply`
          # the static rendered manifests.
          git config --global url."https://x-access-token:${{ secrets.NPM_TOKEN }}@github.com/".insteadOf "https://github.com/"
          # TD-821: overlay path follows `appPath` via K8S_DIR.
          kubectl kustomize "$K8S_DIR/overlays/test/" > /tmp/${{ inputs.slug }}-manifests.yaml
          sudo kubectl apply -f /tmp/${{ inputs.slug }}-manifests.yaml
          # PoC (PLAN-107): NO `rollout restart`. `apply` with the new immutable image
          # tag already triggers a clean single-generation rollout. The extra restart
          # added a second generation → `rollout status` and the pod poll disagreed
          # ("rollout succeeded" yet a pod looked like old image). One generation =
          # `rollout status` is authoritative.

      - name: Wait for rollout (with retry)
        run: |
          set +e
          APP=${{ inputs.slug }}
          for attempt in 1 2 3; do
            if sudo kubectl rollout status deployment/$APP -n "$NS" --timeout=120s; then
              echo "Rollout succeeded on attempt $attempt"
              exit 0
            fi
            if [ $attempt -lt 3 ]; then
              echo "::warning::Rollout attempt $attempt failed, force-deleting stuck Terminating pods..."
              STUCK=$(sudo kubectl get pods -n "$NS" -l app=$APP --no-headers 2>/dev/null | awk '$3 == "Terminating" {print $1}')
              if [ -n "$STUCK" ]; then
                echo "Stuck Terminating pods: $STUCK"
                echo "$STUCK" | xargs -r sudo kubectl delete pod -n "$NS" --force --grace-period=0 || true
              else
                echo "No stuck Terminating pods found"
              fi
              sleep 5
            fi
          done
          echo "::error::Rollout failed after 3 attempts"
          exit 1

      - name: Verify deployment spec image (non-racy)
        run: |
          # PoC (PLAN-107): the racy "non-terminating pod still on old image" poll is
          # REMOVED. Rollout COMPLETION is owned by `rollout status` above (it already
          # waits for new RS available + old RS scaled to 0 — i.e. only new-image pods
          # remain). Rollout CORRECTNESS is confirmed by the version-asserting smoke
          # below (the running app self-reports its built version via /api/version) —
          # a direct signal that doesn't race surge pods on a slow node. Here we keep
          # only a cheap, non-racy assertion that the Deployment SPEC carries the
          # expected image.
          EXPECTED="$IMAGE:$IMAGE_TAG"
          DEPLOY_IMG=$(sudo kubectl get deployment ${{ inputs.slug }} -n "$NS" \
            -o jsonpath='{.spec.template.spec.containers[0].image}')
          echo "Deployment spec image: $DEPLOY_IMG (expected: $EXPECTED)"
          [ "$DEPLOY_IMG" != "$EXPECTED" ] && { echo "::error::Deployment spec image mismatch"; exit 1; }
          echo "::notice::Spec verified. Completion=rollout status, correctness=version smoke."

      - name: Smoke test ${{ inputs.basePath }}/api/version
        if: inputs.smokeMode == 'ingress'
        run: |
          sleep 10
          RESPONSE=$(curl -fsSk --noproxy 'test-liv11.brno.bvv.cz,liv11.brno.bvv.cz' \
            https://test-liv11.brno.bvv.cz${{ inputs.basePath }}/api/version)
          echo "Response: $RESPONSE"
          # Assert version field matches the SNAPSHOT version we built
          EXPECTED_VER="${{ needs.build.outputs.version }}"
          python3 -c "
          import sys, json
          data = json.load(sys.stdin)
          got = data.get('version', '')
          expected = '$EXPECTED_VER'
          assert got == expected, f'Version mismatch: got={got!r} expected={expected!r}'
          env = data.get('environment', '')
          assert env == 'test', f'Expected environment=test, got={env!r}'
          print(f'PASS: test-liv11.brno.bvv.cz${{ inputs.basePath }}/api/version returned version={got!r} environment={env!r}')
          " <<< "$RESPONSE"

      - name: Smoke test ${{ inputs.basePath }}/api/version (cluster-internal via port-forward)
        # smokeMode=port-forward (TD-224, ADR-045 api-internal profile): the app has
        # no public IngressRoute (ADR-020 security boundary), so the smoke goes
        # through kubectl port-forward to the Service. Procedure taken verbatim
        # from the inline bvv-directory-api deploy-test.yml (incl. PF cleanup).
        if: inputs.smokeMode == 'port-forward'
        run: |
          sleep 10
          sudo kubectl port-forward -n "$NS" svc/${{ inputs.slug }} 19891:3000 &
          PF_PID=$!
          sleep 3
          RESPONSE=$(curl -fsSk \
            --retry 3 --retry-delay 5 --retry-all-errors \
            --max-time 10 \
            http://127.0.0.1:19891${{ inputs.basePath }}/api/version)
          kill $PF_PID 2>/dev/null || true
          echo "Response: $RESPONSE"
          EXPECTED_VER="${{ needs.build.outputs.version }}"
          python3 -c "
          import sys, json
          data = json.load(sys.stdin)
          got = data.get('version', '')
          expected = '$EXPECTED_VER'
          assert got == expected, f'Version mismatch: got={got!r} expected={expected!r}'
          env = data.get('environment', '')
          assert env == 'test', f'Expected environment=test, got={env!r}'
          print(f'PASS: /api/version returned version={got!r} environment={env!r}')
          " <<< "$RESPONSE"

      - name: Debug pod status (always)
        if: always()
        run: |
          echo "=== Pods ==="
          sudo kubectl get pods -n "$NS" -o wide
          echo "=== Events ==="
          sudo kubectl get events -n "$NS" --sort-by='.lastTimestamp' | tail -20
          echo "=== Pod logs ==="
          POD=$(sudo kubectl get pods -n "$NS" -l app=${{ inputs.slug }} \
            -o jsonpath='{.items[0].metadata.name}' 2>/dev/null)
          [ -n "$POD" ] && sudo kubectl logs -n "$NS" "$POD" --tail=30 2>&1 || echo "no pod logs"
