# Disposable scratch probe (k8s-workspace:TD-728) — NOT for merging.
# Bisecting which of the several diffs between the succeeding checkout-only
# probe and the failing full-replica probe actually causes zero-jobs.
# This version: adds ONLY `permissions: contents: read` at the top level,
# keeps everything else (job id `probe`, no name:, single echo step) as the
# last-known-good version.
on:
  workflow_call:
    secrets:
      NPM_TOKEN:
        required: true
        description: Probe secret, mirrors app-adr073-verdict-gate.yml's shape.

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Fetch ADR-073 verdict-gate script from k8s-workspace (pinned)
        uses: actions/checkout@v5
        with:
          repository: TradeFairs/k8s-workspace
          ref: 5670dfdd2d69d796a417a1acba68bbeadded6bc9
          token: ${{ secrets.NPM_TOKEN }}
          sparse-checkout: |
            bin/preflight-checks-adr073-verdict.py
          sparse-checkout-cone-mode: false
          path: _adr073-gate-script

      - run: echo "checkout step completed, file exists:" && ls -la _adr073-gate-script/bin/
