# app-ci.yml — reusable CI workflow: lint, typecheck, unit tests (ADR-023 §K.1) +
# build-once-on-PR Docker image (ADR-034). On pull_request the Docker build
# subsumes the compile check and pushes :pr-<head-sha>; deploy-test promotes it.
# Callers: TradeFairs/<app>/.github/workflows/ci.yml  (uses: TradeFairs/.github/.github/workflows/app-ci.yml@v2)
name: App CI (reusable)

on:
  workflow_call:
    inputs:
      slug:
        required: true
        type: string
      basePath:
        required: true
        type: string
      # ── Optional, backward-compatible knobs (TD-115 / PLAN-114) ──────────────
      # Defaults preserve the prior reusable behavior: no yalc/release-order gate,
      # no DB (the former always-on postgres service was unused — no DATABASE_URL
      # was ever wired into the test step), standard basePath guard.
      runYalcGuard:
        description: 'Run the yalc-ref guard on package.json (PLAN-062).'
        type: boolean
        default: false
      runReleaseOrder:
        description: 'Run the @tradefairs/* publish-order gate (.github/scripts/release-order.sh) before ci.'
        type: boolean
        default: false
      postgres:
        description: 'Provision a Postgres for the ci job: none | alpine | pgvector.'
        type: string
        default: none
      dbMigrate:
        description: 'Run `pnpm db:migrate` against the provisioned Postgres (requires postgres != none).'
        type: boolean
        default: false
      dbTests:
        description: 'Expose DATABASE_URL to the test step so DB-gated (describeIfDb) suites run in CI (requires postgres != none + dbMigrate). Default false → such suites skip.'
        type: boolean
        default: false
      basePathGuard:
        description: 'Hardcoded-basePath-literal guard: standard | off.'
        type: string
        default: standard
      # ── Optional profile knobs (TD-224 / PLAN-131 / ADR-045) ─────────────────
      buildVerify:
        description: >-
          Build the PR Docker image WITHOUT pushing to ghcr.io — compile/bundle
          verification only, for apps without PR-image promotion (no deploy-test
          to promote :pr-<sha> into; ADR-045 admin-prod-only profile, e.g.
          bvv-test-admin). Default false = build AND push (today's behavior).
        type: boolean
        default: false
      draft:
        description: >-
          The calling PR's actual current draft state, passed explicitly by the
          caller as github.event.pull_request.draft (literally, NOT wrapped in
          ${ }) from ITS OWN top-level context (TD-260). Do not rely on this
          reusable workflow re-reading
          github.event.pull_request.draft itself under workflow_call — TD-243/
          TD-260 found that field unreliable (type-fidelity gap) at this nested
          call boundary, which silently broke build-image's draft-gate for every
          PR fleet-wide from 2026-06-17 to 2026-07-09. No default: callers that
          don't pass this explicitly get build-image treated as non-draft
          (fail-open, consistent with ADR-034 "never fail closed" — better to
          build an extra draft's image than to silently never build a real PR's).
        type: boolean
      ciRunsOn:
        description: >-
          JSON array (as a string) of runner labels for the `ci` and
          `build-image` jobs, consumed via `fromJSON(inputs.ciRunsOn)`
          (TD-273 / ADR-047 §C). Default is a no-op — every existing caller
          keeps running on GitHub-hosted `ubuntu-latest` until it opts in
          (e.g. '["self-hosted","liv26"]').
        type: string
        default: '"ubuntu-latest"'

permissions:
  contents: read

# Cancel superseded CI runs: pushing a new commit to a PR aborts the in-flight
# run for the previous commit instead of letting both finish. Keyed on the PR ref
# so concurrent PRs never cancel each other. Saves GHA minutes on rapid pushes.
concurrency:
  group: app-ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ${{ fromJSON(inputs.ciRunsOn) }}

    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Yalc guard
        # PLAN-062 — opt-in. Fail if package.json carries dev-only file:.yalc/ refs.
        if: inputs.runYalcGuard
        run: |
          if grep -q '"file:\.yalc/' package.json; then
            echo "::error::package.json contains file:.yalc/ refs — yalc is dev-only, publish + bump before merging"
            grep -n '"file:\.yalc/' package.json
            exit 1
          fi

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          # TD-287: on self-hosted liv26 the pnpm store already persists on
          # the runner container's own writable layer across job runs (the
          # container is restarted in-place, never recreated) — GHA's
          # remote pnpm-cache upload/restore is pure redundant overhead
          # there (verified: `/home/runner/.local/share/pnpm` survives
          # across the container's ephemeral-per-job runner registrations,
          # confirmed via RestartCount + unchanged container ID on liv26).
          # `ubuntu-latest` keeps `cache: pnpm` unchanged — its runner VM
          # is genuinely ephemeral per job with no local disk to persist.
          # NOTE: condition is inverted (`!contains(...) && 'pnpm' || ''`)
          # rather than `contains(...) && '' || 'pnpm'` — GHA expressions
          # treat '' as falsy, so with the naive ordering the `&&` branch's
          # '' result falls through the `||` and always yields 'pnpm'
          # (classic JS ternary-via-&&/|| gotcha, confirmed empirically: a
          # live self-hosted run with the naive expression still logged
          # `cache: pnpm` and paid the full 4m Post Run cost). Putting the
          # only-ever-empty-string branch on the `||` side avoids it.
          cache: ${{ !contains(inputs.ciRunsOn, 'self-hosted') && 'pnpm' || '' }}
          registry-url: https://npm.pkg.github.com
          scope: '@tradefairs'

      - name: Release-order gate
        # Optional publish-order gate (opt-in via runReleaseOrder). Asserts every
        # @tradefairs/* dep resolves to a published version (PLAN-063). Folded
        # into this job as a step (TD-257) to reuse the checkout + setup-node
        # above instead of paying a separate job's runner-boot/checkout/setup-node
        # overhead on every CI run. A step failure fails `ci` directly — no
        # needs/skipped-result juggling required.
        if: inputs.runReleaseOrder
        run: bash .github/scripts/release-order.sh --check-only .
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Start Postgres
        # Conditional DB via step-level `docker run` (a `services:` block cannot be
        # toggled by an input). By default DATABASE_URL is NOT exported to GITHUB_ENV
        # — it is scoped to the DB migrate step only, so `pnpm test` does not see it
        # and DB-gated suites (describeIfDb) skip (the prior inline-CI behavior).
        # Opt in via `dbTests: true` to export it globally and actually run those
        # suites in CI (requires dbMigrate so the schema exists).
        #
        # TD-283: container name and host port MUST be unique per run, not the
        # fixed `ci-postgres`/`5432` this used to hardcode. That was safe on
        # ubuntu-latest (one isolated VM per job) but collides the instant two
        # DB-using apps run concurrently on the liv26 self-hosted fleet, where
        # all 3 runners share one host Docker daemon (DooD) — confirmed live:
        # "Conflict. The container name /ci-postgres is already in use", and a
        # second job silently talking to the FIRST job's Postgres instance
        # (wrong schema) when the name collision didn't hard-fail first.
        #
        # TD-284: on self-hosted, a HOST-published port (`-p 0:5432`) is
        # unreachable via `localhost` from INSIDE the runner container — the
        # runner containers sit on their own Docker bridge network (not
        # `network_mode: host`), so their `localhost` is an isolated loopback
        # disconnected from the host's network stack where the port was
        # actually published. `docker exec ... pg_isready` gave false
        # confidence because `docker exec` bypasses networking entirely.
        # Verified fix: attach Postgres to the SAME network as the runner
        # container itself (discovered dynamically via
        # `docker inspect "$(hostname)"` — works from inside the runner via
        # the mounted docker.sock) and connect via the container name
        # (Docker's embedded DNS), never `localhost`, on self-hosted. This is
        # gated on the same `${HTTP_PROXY:-}` self-hosted signal TD-280/281/282
        # already use — never hardcode the liv26 compose network name here.
        # ubuntu-latest (bare VM, no such isolation) keeps the original
        # localhost + published-port path unchanged.
        if: inputs.postgres != 'none'
        id: postgres
        run: |
          IMAGE=postgres:17-alpine
          if [ "${{ inputs.postgres }}" = "pgvector" ]; then IMAGE=pgvector/pgvector:pg17; fi
          CONTAINER_NAME="ci-postgres-${{ github.run_id }}-${{ github.run_attempt }}"
          echo "container_name=${CONTAINER_NAME}" >> "$GITHUB_OUTPUT"
          if [ -n "${HTTP_PROXY:-}" ]; then
            MY_NETWORK=$(docker inspect "$(hostname)" --format '{{range $k,$v := .NetworkSettings.Networks}}{{$k}}{{end}}')
            docker run -d --name "$CONTAINER_NAME" --network "$MY_NETWORK" \
              -e POSTGRES_USER="${{ inputs.slug }}" \
              -e POSTGRES_PASSWORD=dev \
              -e POSTGRES_DB="${{ inputs.slug }}" \
              "$IMAGE"
            PG_HOST="$CONTAINER_NAME"
            PG_PORT="5432"
          else
            docker run -d --name "$CONTAINER_NAME" \
              -e POSTGRES_USER="${{ inputs.slug }}" \
              -e POSTGRES_PASSWORD=dev \
              -e POSTGRES_DB="${{ inputs.slug }}" \
              -p 0:5432 "$IMAGE"
            PG_HOST="localhost"
            PG_PORT=$(docker port "$CONTAINER_NAME" 5432/tcp | tail -1 | awk -F: '{print $NF}')
          fi
          echo "pg_host=${PG_HOST}" >> "$GITHUB_OUTPUT"
          echo "pg_port=${PG_PORT}" >> "$GITHUB_OUTPUT"
          if [ "${{ inputs.dbTests }}" = "true" ]; then
            echo "DATABASE_URL=postgres://${{ inputs.slug }}:dev@${PG_HOST}:${PG_PORT}/${{ inputs.slug }}" >> "$GITHUB_ENV"
          fi
          for i in $(seq 1 30); do
            if docker exec "$CONTAINER_NAME" pg_isready -U "${{ inputs.slug }}" >/dev/null 2>&1; then
              echo "Postgres ready after ${i} attempt(s)"; break
            fi
            echo "Waiting for Postgres ($i/30)..."; sleep 2
          done

      - name: DB migrate
        # Opt-in; requires postgres != none. DATABASE_URL is scoped to THIS step
        # (not global) so it does not leak into `pnpm test` — see Start Postgres.
        if: inputs.dbMigrate
        run: pnpm db:migrate
        env:
          DATABASE_URL: postgres://${{ inputs.slug }}:dev@${{ steps.postgres.outputs.pg_host }}:${{ steps.postgres.outputs.pg_port }}/${{ inputs.slug }}

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Guard against hardcoded basePath literals
        # ADR-024 §G — CI fails if any source file contains a hardcoded basePath literal.
        if: inputs.basePathGuard == 'standard'
        run: |
          if grep -rn "['\"]\\${{ inputs.basePath }}['\"]" src --include='*.ts*' --exclude-dir=__tests__ --exclude='*.test.ts' --exclude='*.test.tsx' 2>/dev/null; then
            echo "::error::Hardcoded basePath literal found in src/. Use APP_BASE_PATH env per ADR-024."
            exit 1
          fi

      - name: Stop Postgres
        # TD-283: on a persistent shared host (liv26), a leftover ci-postgres-*
        # container occupies a random host port and disk indefinitely unless
        # explicitly removed here — unlike ubuntu-latest, where the whole VM
        # (and any container in it) is discarded after the job regardless.
        if: always() && inputs.postgres != 'none'
        run: docker rm -f "${{ steps.postgres.outputs.container_name }}" 2>/dev/null || true

  # ── build-once-on-PR (ADR-034) ───────────────────────────────────────────────
  # On pull_request, build + push the production Docker image tagged by PR head
  # SHA. deploy-test promotes (retags) this image on merge instead of rebuilding.
  # The Docker build subsumes the former `pnpm build` compile check.
  build-image:
    # Skip the (expensive) Docker build on DRAFT PRs — only build once the PR is
    # marked ready for review. Iterating in draft therefore costs no image builds;
    # deploy-test's promote-on-merge falls back to rebuild if no :pr-<sha> exists
    # (ADR-034 "never fail closed"). See AGENTS.md "GHA cost discipline".
    #
    # Gated on the explicit `draft` INPUT (see inputs.draft above), not on
    # github.event.pull_request.draft read directly inside this reusable
    # workflow. TD-243 (gis-dms) found the latter unconditionally skipped
    # build-image for every PR fleet-wide since 2026-06-17 (commit 8c37c77d)
    # regardless of true draft state, confirmed via `gh api` cross-referenced
    # against real PR timelines. TD-260's local diagnostic (both a local-path
    # and a true cross-repo `uses:`-ref act reproduction, matching production's
    # exact call shape) reproduced a type-fidelity failure mode: comparing a
    # non-boolean-typed `draft` value with `== false` permanently fails the
    # AND-condition regardless of actual draft state — exactly TD-243's
    # observed symptom. Reading `draft` through a strongly-typed
    # `workflow_call` input (validated at the call boundary, from the
    # caller's own reliable top-level context) sidesteps that class of bug
    # entirely; the nested `github.event.pull_request.*` fields are not
    # otherwise used for this gate.
    if: inputs.draft == false
    needs: ci
    runs-on: ${{ fromJSON(inputs.ciRunsOn) }}
    # 2026-07-26 incident (service-desk PR #245, run 30210209077): the
    # self-hosted runner self-updated mid-job and crash-looped for ~19min
    # (13 Listener restarts across all 3 liv26 runners), orphaning this
    # job's completion report to GitHub even though the actual Docker build
    # had already finished. With no timeout-minutes, the run sat shown as
    # in_progress for ~2h instead of failing fast. A real build+push here
    # takes ~1-2min; 15min matches the sibling `ci` job's budget.
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - name: Read version from package.json
        id: meta
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=pr-${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT"

      - name: Compute buildx driver-opts + build-args (self-hosted proxy passthrough)
        # TD-280: docker/setup-buildx-action's docker-container driver spawns
        # an isolated builder container via the Docker API (not `docker run`),
        # so it inherits neither ~/.docker/config.json proxies nor this job's
        # own HTTP_PROXY/HTTPS_PROXY env — on a self-hosted runner behind a
        # proxy (e.g. liv26/bvvproxy) the builder otherwise can't reach
        # github.com/ghcr.io at all. Read proxy values dynamically from this
        # runner's own environment (empty on ubuntu-latest -> empty
        # driver-opts -> no behavior change there); never hardcode a specific
        # proxy URL in this shared reusable workflow.
        #
        # TD-281: separately, Dockerfile RUN steps (pnpm/npm install etc.) run
        # inside the BuildKit build context and do NOT inherit the runner's
        # proxy env either — they need HTTP_PROXY/HTTPS_PROXY as build-args
        # instead. These are Docker's "predefined ARGs": available in every
        # RUN step automatically once passed as --build-arg, with no `ARG`
        # declaration needed in the app's own Dockerfile.
        #
        # TD-282: docker/setup-buildx-action's default docker-container driver
        # spawns a FRESH, throwaway builder container per job — its local
        # BuildKit cache never persists across jobs/runners (confirmed: the
        # pilot's 3 attempts each got a different random builder name, and a
        # cold build took 15min on liv26 despite low CPU use, because the only
        # cache path left was a slow registry round-trip through bvvproxy).
        # On self-hosted (proxy set), force the classic `docker` driver
        # instead — it's BuildKit embedded directly in the host dockerd, using
        # its already-shared, already-proxy-configured (TD-272) image/layer
        # store, so cache is genuinely shared across all runners and jobs
        # (measured: repeat build of the same Dockerfile: minutes -> ~2s).
        # `driver-opts` (TD-280) becomes a no-op on liv26 with this driver
        # (classic driver spawns no new container to configure) but is kept
        # for ubuntu-latest as a harmless, already-empty fallback.
        id: buildx_opts
        shell: bash
        run: |
          # The opts<<EOF/EOF and build_args<<EOF/EOF GITHUB_OUTPUT heredocs
          # below are safe only because HTTP_PROXY/HTTPS_PROXY are
          # operator-set proxy URLs, never untrusted/user-controlled input —
          # a value containing a bare `EOF` line would terminate them early.
          {
            if [ -n "${HTTP_PROXY:-}" ]; then echo "env.HTTP_PROXY=${HTTP_PROXY}"; fi
            if [ -n "${HTTPS_PROXY:-}" ]; then echo "env.HTTPS_PROXY=${HTTPS_PROXY}"; fi
          } > /tmp/buildx-driver-opts.txt
          {
            if [ -n "${HTTP_PROXY:-}" ]; then echo "HTTP_PROXY=${HTTP_PROXY}"; fi
            if [ -n "${HTTPS_PROXY:-}" ]; then echo "HTTPS_PROXY=${HTTPS_PROXY}"; fi
          } > /tmp/buildx-build-args.txt
          {
            echo 'opts<<EOF'
            cat /tmp/buildx-driver-opts.txt
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
          {
            echo 'build_args<<EOF'
            cat /tmp/buildx-build-args.txt
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
          if [ -n "${HTTP_PROXY:-}" ]; then
            echo "driver=docker" >> "$GITHUB_OUTPUT"
          else
            echo "driver=" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@v4
        with:
          driver: ${{ steps.buildx_opts.outputs.driver }}
          driver-opts: ${{ steps.buildx_opts.outputs.driver == '' && steps.buildx_opts.outputs.opts || '' }}

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.NPM_TOKEN }}

      - name: Build and push PR image
        # TD-294: cache-from/cache-to's `type=registry,...` target is a
        # separate mechanism from TD-282's classic-driver local BuildKit
        # cache — on self-hosted (liv26) the local daemon cache (TD-282)
        # already makes layers CACHED, so the registry round-trip
        # (ghcr.io import + mode=max export, ~48s/job measured) is pure
        # redundant overhead. Conditioned off for self-hosted only, same
        # `${{ !contains(inputs.ciRunsOn, 'self-hosted') && <value> || '' }}`
        # formula (and `&&`/`||` falsy-`''`-on-the-left gotcha avoidance) as
        # TD-287's `cache: pnpm` fix — `ubuntu-latest` is unaffected (still
        # gets the full registry cache-from/cache-to, its only cross-job
        # cache path on an ephemeral VM). `type=inline` cache-to target is
        # cheap (embeds cache metadata in the pushed image manifest, no
        # separate registry round-trip) and stays unconditional for both.
        if: ${{ !inputs.buildVerify }}
        uses: docker/build-push-action@v7
        with:
          push: true
          secrets: |
            NPM_TOKEN=${{ secrets.NPM_TOKEN }}
          build-args: |
            APP_BASE_PATH=${{ inputs.basePath }}
            NEXT_PUBLIC_APP_BASE_PATH=${{ inputs.basePath }}
            NEXT_PUBLIC_BVV_ENV=test
            NEXT_PUBLIC_APP_VERSION=${{ steps.meta.outputs.version }}
            APP_GIT_COMMIT=${{ github.event.pull_request.head.sha }}
            APP_BUILD_TIME=1970-01-01T00:00:00Z
            ${{ steps.buildx_opts.outputs.build_args }}
          tags: |
            ghcr.io/tradefairs/${{ inputs.slug }}:${{ steps.meta.outputs.tag }}
          cache-from: ${{ !contains(inputs.ciRunsOn, 'self-hosted') && format('type=registry,ref=ghcr.io/tradefairs/{0}:buildcache', inputs.slug) || '' }}
          cache-to: |
            ${{ !contains(inputs.ciRunsOn, 'self-hosted') && format('type=registry,ref=ghcr.io/tradefairs/{0}:buildcache,mode=max', inputs.slug) || '' }}
            type=inline

      - name: Build image (verify only, no push)
        # buildVerify (TD-224, ADR-045 admin-prod-only): the Docker build is a
        # compile/bundle check only — nothing is pushed to ghcr.io (no :pr-<sha>
        # tag, no buildcache write; cache-from still READS the shared buildcache
        # on ubuntu-latest; on self-hosted cache-from is conditioned off per
        # TD-294, see "Build and push PR image" above — same formula).
        # Used by apps whose deploy-test is a stub, so there is no promotion to
        # feed a PR image into.
        if: inputs.buildVerify
        uses: docker/build-push-action@v7
        with:
          push: false
          secrets: |
            NPM_TOKEN=${{ secrets.NPM_TOKEN }}
          build-args: |
            APP_BASE_PATH=${{ inputs.basePath }}
            NEXT_PUBLIC_APP_BASE_PATH=${{ inputs.basePath }}
            NEXT_PUBLIC_BVV_ENV=test
            NEXT_PUBLIC_APP_VERSION=${{ steps.meta.outputs.version }}
            APP_GIT_COMMIT=${{ github.event.pull_request.head.sha }}
            APP_BUILD_TIME=1970-01-01T00:00:00Z
            ${{ steps.buildx_opts.outputs.build_args }}
          tags: |
            ghcr.io/tradefairs/${{ inputs.slug }}:${{ steps.meta.outputs.tag }}
          cache-from: ${{ !contains(inputs.ciRunsOn, 'self-hosted') && format('type=registry,ref=ghcr.io/tradefairs/{0}:buildcache', inputs.slug) || '' }}
