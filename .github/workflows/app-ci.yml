# app-ci.yml — reusable CI workflow: lint, typecheck, unit tests (ADR-023 §K.1) +
# build-once-on-PR Docker image (ADR-034). On pull_request the Docker build
# subsumes the compile check and pushes :pr-<head-sha>; deploy-test promotes it.
# Callers: TradeFairs/<app>/.github/workflows/ci.yml  (uses: TradeFairs/.github/.github/workflows/app-ci.yml@v2)
name: App CI (reusable)

on:
  workflow_call:
    inputs:
      slug:
        required: true
        type: string
      basePath:
        required: true
        type: string

permissions:
  contents: read

# Cancel superseded CI runs: pushing a new commit to a PR aborts the in-flight
# run for the previous commit instead of letting both finish. Keyed on the PR ref
# so concurrent PRs never cancel each other. Saves GHA minutes on rapid pushes.
concurrency:
  group: app-ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ${{ inputs.slug }}
          POSTGRES_PASSWORD: dev
          POSTGRES_DB: ${{ inputs.slug }}
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: pnpm/action-setup@v4
        with: { version: 10 }

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: '@tradefairs'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            ${{ github.workspace }}/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/pnpm-lock.yaml') }}-${{ hashFiles('**/*.[jt]s', '**/*.[jt]sx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/pnpm-lock.yaml') }}-

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Guard against hardcoded basePath literals
        # ADR-024 §G — CI fails if any source file contains a hardcoded basePath literal.
        run: |
          if grep -rn "['\"]\\${{ inputs.basePath }}['\"]" src --include='*.ts*' --exclude-dir=__tests__ 2>/dev/null; then
            echo "::error::Hardcoded basePath literal found in src/. Use APP_BASE_PATH env per ADR-024."
            exit 1
          fi

  # ── build-once-on-PR (ADR-034) ───────────────────────────────────────────────
  # On pull_request, build + push the production Docker image tagged by PR head
  # SHA. deploy-test promotes (retags) this image on merge instead of rebuilding.
  # The Docker build subsumes the former `pnpm build` compile check.
  build-image:
    # Skip the (expensive) Docker build on DRAFT PRs — only build once the PR is
    # marked ready for review. Iterating in draft therefore costs no image builds;
    # deploy-test's promote-on-merge falls back to rebuild if no :pr-<sha> exists
    # (ADR-034 "never fail closed"). See AGENTS.md "GHA cost discipline".
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == false
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - name: Read version from package.json
        id: meta
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=pr-${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.NPM_TOKEN }}

      - name: Build and push PR image
        uses: docker/build-push-action@v7
        with:
          push: true
          secrets: |
            NPM_TOKEN=${{ secrets.NPM_TOKEN }}
          build-args: |
            APP_BASE_PATH=${{ inputs.basePath }}
            NEXT_PUBLIC_APP_BASE_PATH=${{ inputs.basePath }}
            NEXT_PUBLIC_BVV_ENV=test
            NEXT_PUBLIC_APP_VERSION=${{ steps.meta.outputs.version }}
            APP_GIT_COMMIT=${{ github.event.pull_request.head.sha }}
            APP_BUILD_TIME=1970-01-01T00:00:00Z
          tags: |
            ghcr.io/tradefairs/${{ inputs.slug }}:${{ steps.meta.outputs.tag }}
          cache-from: type=registry,ref=ghcr.io/tradefairs/${{ inputs.slug }}:buildcache
          cache-to: |
            type=registry,ref=ghcr.io/tradefairs/${{ inputs.slug }}:buildcache,mode=max
            type=inline
