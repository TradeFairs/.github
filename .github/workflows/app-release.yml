# app-release.yml — reusable release-to-production workflow (ADR-023 §K.3, PLAN-105).
# Carries the full, identical-across-apps release ceremony so apps don't drift:
#   preflight (SNAPSHOT + semver) → bump+commit+tag → build prod image →
#   deploy-prod (k3s ctr pull, PLAN-047) → bump to next SNAPSHOT → push + GH Release.
# Prod images are REBUILT (build-arg NEXT_PUBLIC_BVV_ENV=production differs from
# test) — ADR-034 promotion is test-only/out-of-scope for release. HOW they are
# rebuilt is selected by `imageStrategy`: docker (default, buildx from the app
# Dockerfile) or crane (ADR-083 krok 5b — monorepo-only layer-append via the
# caller-local .github/actions/release-crane-image composite).
# Trigger stays in the caller (PLAN-105 D7): the caller is a thin workflow_dispatch
# that passes releaseVersion + nextVersion and `uses:` this workflow.
# Callers: TradeFairs/<app>/.github/workflows/release.yml
#   (uses: TradeFairs/.github/.github/workflows/app-release.yml@v2)
name: App Release to production (reusable)

on:
  workflow_call:
    inputs:
      slug:
        required: true
        type: string
      basePath:
        required: true
        type: string
      releaseVersion:
        description: 'Release version (e.g. 0.2.0 — must match package.json SNAPSHOT minus suffix)'
        required: true
        type: string
      nextVersion:
        description: 'Next development version (e.g. 0.3.0 — -SNAPSHOT added automatically)'
        required: true
        type: string
      # ── Optional profile knobs (TD-224 / PLAN-131 / ADR-045) ─────────────────
      smokeMode:
        description: >-
          Prod smoke-test transport: ingress (default — public
          https://liv11.brno.bvv.cz<basePath>/api/version) | port-forward
          (kubectl port-forward to the Service + curl via localhost, for
          cluster-internal apps without an IngressRoute — ADR-020 security
          boundary, ADR-045 api-internal profile, e.g. bvv-directory-api).
        type: string
        default: ingress
      skipTestPreflight:
        description: >-
          Skip the ADVISORY "test namespace runs main HEAD" preflight — for
          prod-only apps without a test deployment (ADR-045 admin-prod-only
          profile, e.g. bvv-test-admin). The preflight is warning-only and
          never fails a release (see the step comment).
        type: boolean
        default: false
      appPath:
        description: >-
          Monorepo-relative path (e.g. `apps/<slug>`) to the app's own
          `package.json`, used instead of the repo-root one for the pre-flight
          SNAPSHOT check and for both version rewrites (TD-820, mirroring
          `app-deploy-test.yml`'s input of the same name — TD-625 / ADR-071
          §12.1: the monorepo root version has no meaning and nothing may be
          derived from it). Default is a no-op empty string: every existing
          standalone-repo caller keeps reading and writing its own repo-root
          `package.json` unchanged until it opts in from inside the future
          consolidated `bvv-platform` monorepo (ADR-071 step 4+, not in scope
          here).
        type: string
        default: ''
      tagPrefix:
        description: >-
          Prefix for the release tag, so a monorepo caller can tag
          `app/<slug>@<version>` per ADR-071 §10 instead of a bare
          `v<version>` in a tag namespace shared by 13 apps (TD-820; the
          collision is measured — `v0.19.0` already exists as three different
          commits across `service-desk`, `dovolenky` and `jira-status-web`).
          Default is a no-op empty string: the tag stays exactly
          `v<releaseVersion>` for every existing standalone-repo caller, at
          tag creation, push, checkout and GitHub Release alike.
        type: string
        default: ''
      ciRunsOn:
        description: >-
          JSON array (as a string) of runner labels for the `release` job,
          consumed via `fromJSON(inputs.ciRunsOn)` (TD-273 / ADR-047 §C).
          Default is a no-op — every existing caller keeps releasing on
          GitHub-hosted `ubuntu-latest` until it opts in (e.g.
          '["self-hosted","liv26"]'). The `deploy-prod` job is unaffected —
          it stays pinned to the literal `[self-hosted, liv11]` label.
        type: string
        default: '"ubuntu-latest"'
      imageStrategy:
        description: >-
          How the prod image is built (ADR-083 krok 5b, k8s-workspace):
          `docker` (default — buildx build from the app Dockerfile,
          byte-identical to today for every existing caller) | `crane`
          (turbo-builds the app directly on the runner and appends the Next
          standalone output onto the pinned bvv-app-base, via the
          CALLER-LOCAL composite `.github/actions/release-crane-image`).
          That composite exists only in TradeFairs/bvv-platform — it owns
          the INVENTORY per-app data (migrate deps, runtime dirs, base-image
          pin) this workflow deliberately knows nothing about — so only the
          monorepo may opt in; a standalone caller passing `crane` fails at
          the `uses:` resolution, loudly, not silently.
        type: string
        default: 'docker'
      loadRestrictor:
        description: >-
          Extra flag passed to `kubectl kustomize` when rendering the prod
          overlay (PLAN-250 krok 4). Default `''` = today's exact behavior for
          every caller. The only intended value is
          `--load-restrictor=LoadRestrictionsNone`, needed by `jira-status`,
          whose configMapGenerator reads `../../notification_rules.yaml` from
          outside `k8s/`. Do NOT set it fleet-wide: the default restrictor is
          what keeps an overlay from silently reaching into arbitrary files.
        type: string
        default: ''
      deployOnly:
        description: >-
          Skip the whole `release` job (preflight, version bump, tag, image
          build, bump PR, GitHub Release) and run ONLY `deploy-prod` for a
          release tag that ALREADY EXISTS. For recovering a release whose
          artifacts were produced but whose deploy never ran — the exact
          situation left by the mergeStateStatus bug fixed in this file
          (bvv-portal 0.3.0, 2026-08-28: tag + image pushed, deploy-prod
          skipped because the bump PR could not be merged).

          `nextVersion` is ignored in this mode (nothing is bumped) but stays
          required by `workflow_call` — pass the value already on main.
          `deploy-prod` is self-contained: it derives everything from
          `releaseVersion` (image tag + `ref:` of the checkout), so it does
          not depend on any output of the skipped job.

          NOT a way to skip the release ceremony for a NEW version: with no
          matching tag the checkout fails loudly.
        type: boolean
        default: false

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ inputs.slug }}
  cancel-in-progress: false  # never cancel a release mid-rollout

jobs:
  release:
    if: ${{ !inputs.deployOnly }}
    runs-on: ${{ fromJSON(inputs.ciRunsOn) }}
    timeout-minutes: 30
    env:
      IMAGE: ghcr.io/tradefairs/${{ inputs.slug }}
      # TD-820: the release tag. With the default empty `tagPrefix` this is the
      # literal 'v' + releaseVersion — byte-identical to the previous hardcoded
      # "v${{ inputs.releaseVersion }}" at every one of its uses (tag creation,
      # push, GitHub Release, and the deploy-prod checkout ref). A monorepo
      # caller passes e.g. `app/service-desk@` for ADR-071 §10 tags.
      RELEASE_TAG: ${{ inputs.tagPrefix != '' && inputs.tagPrefix || 'v' }}${{ inputs.releaseVersion }}
      # TD-820: repo-root-relative path to the app's package.json. Empty
      # `appPath` yields the literal 'package.json' / './package.json' used
      # today; a monorepo caller passes e.g. `apps/service-desk`.
      APP_PATH: ${{ inputs.appPath }}

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # full history to push commits + tag back to main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Pre-flight checks
        id: preflight
        run: |
          RELEASE_VER="${{ inputs.releaseVersion }}"
          NEXT_VER="${{ inputs.nextVersion }}"
          # TD-820 / ADR-071 §12.1: when appPath is set (monorepo caller only —
          # every one of today's 12 standalone-repo callers leaves it unset),
          # read the version from apps/<slug>/package.json instead of the
          # repo-root package.json; the monorepo root version has no meaning and
          # nothing may be derived from it. The empty default takes the else
          # branch, which is today's exact command unchanged.
          if [ -n "$APP_PATH" ]; then
            CURRENT_VER=$(node -p "require('./${APP_PATH}/package.json').version")
          else
            CURRENT_VER=$(node -p "require('./package.json').version")
          fi
          echo "Current package.json version: $CURRENT_VER"
          echo "Release version requested:    $RELEASE_VER"
          echo "Next dev version:             $NEXT_VER"
          # 1. package.json must be <releaseVersion>-SNAPSHOT
          EXPECTED_SNAPSHOT="${RELEASE_VER}-SNAPSHOT"
          if [ "$CURRENT_VER" != "$EXPECTED_SNAPSHOT" ]; then
            echo "::error::package.json is '$CURRENT_VER', expected '$EXPECTED_SNAPSHOT'."
            echo "::error::Ensure main is at the correct SNAPSHOT before releasing."
            exit 1
          fi
          # 2. nextVersion must be strictly greater (basic semver check)
          python3 -c "
          import sys
          def parse(v): return tuple(int(x) for x in v.split('.'))
          r, n = '$RELEASE_VER', '$NEXT_VER'
          if parse(n) <= parse(r):
            print(f'::error::nextVersion {n!r} must be > releaseVersion {r!r}')
            sys.exit(1)
          print(f'Version ordering OK: {r} -> {n}')
          "

      - name: Test-env preflight (advisory) — test ns runs current main HEAD
        # TD-224: automated, ADVISORY form of the release-skill precondition
        # "test environment healthy and at current main HEAD". It compares the
        # head SHA of the last successful deploy-test run on main with HEAD and
        # emits a ::warning:: on mismatch. It NEVER fails the release: a hard
        # gate would change behavior for existing @v2 consumers (excluded by
        # TD-224) and would false-fail after docs-only commits (deploy-test has
        # paths-ignore for **.md/docs/**). Prod-only apps (ADR-045
        # admin-prod-only) skip it entirely via skipTestPreflight: true.
        if: ${{ !inputs.skipTestPreflight }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          LATEST=$(gh api "repos/${{ github.repository }}/actions/workflows/deploy-test.yml/runs?branch=main&status=success&per_page=1" \
            --jq '.workflow_runs[0].head_sha // ""' 2>/dev/null)
          if [ -z "$LATEST" ]; then
            echo "::warning::Test-env preflight: could not resolve the last successful deploy-test run (no deploy-test.yml workflow, no successful run yet, or API error) — advisory check inconclusive."
            exit 0
          fi
          if [ "$LATEST" = "${{ github.sha }}" ]; then
            echo "Test-env preflight OK: last successful deploy-test on main is at HEAD ($LATEST)."
          else
            echo "::warning::Test-env preflight: last successful deploy-test on main is $LATEST but HEAD is ${{ github.sha }} — test ns may be stale (docs-only commits are a benign cause). Advisory only, not blocking."
          fi
          exit 0

      - name: Validate imageStrategy
        run: |
          case "${{ inputs.imageStrategy }}" in
            docker|crane) ;;
            *) echo "::error::imageStrategy must be 'docker' or 'crane', got '${{ inputs.imageStrategy }}'"; exit 1 ;;
          esac

      # ── Docker image path (imageStrategy: docker — every standalone caller) ──
      # The three buildx/build-push steps below are gated as a unit; the crane
      # path replaces exactly them (same position in the ceremony: after the
      # release-version bump, before the SNAPSHOT bump) and nothing else.
      # `docker/login-action` stays UNGATED — crane reads the same
      # ~/.docker/config.json credential.
      - name: Compute buildx driver-opts + build-args (self-hosted proxy passthrough)
        if: inputs.imageStrategy == 'docker'
        # TD-280: see app-ci.yml for the full rationale — the buildx
        # docker-container driver's builder doesn't inherit this job's proxy
        # env, so forward it dynamically (empty on ubuntu-latest, no-op there).
        # TD-281: Dockerfile RUN steps (pnpm/npm install) need the same values
        # as build-args instead (Docker's predefined ARGs — no Dockerfile
        # `ARG` declaration needed).
        # TD-282: force the classic `docker` driver on self-hosted so cache is
        # genuinely shared (see app-ci.yml for the full rationale — the
        # docker-container driver's per-job throwaway builder never persisted
        # cache across jobs/runners).
        id: buildx_opts
        shell: bash
        run: |
          # opts<<EOF/EOF and build_args<<EOF/EOF below are safe only because
          # HTTP_PROXY/HTTPS_PROXY are operator-set proxy URLs, never
          # untrusted input.
          {
            if [ -n "${HTTP_PROXY:-}" ]; then echo "env.HTTP_PROXY=${HTTP_PROXY}"; fi
            if [ -n "${HTTPS_PROXY:-}" ]; then echo "env.HTTPS_PROXY=${HTTPS_PROXY}"; fi
          } > /tmp/buildx-driver-opts.txt
          {
            if [ -n "${HTTP_PROXY:-}" ]; then echo "HTTP_PROXY=${HTTP_PROXY}"; fi
            if [ -n "${HTTPS_PROXY:-}" ]; then echo "HTTPS_PROXY=${HTTPS_PROXY}"; fi
          } > /tmp/buildx-build-args.txt
          {
            echo 'opts<<EOF'
            cat /tmp/buildx-driver-opts.txt
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
          {
            echo 'build_args<<EOF'
            cat /tmp/buildx-build-args.txt
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
          if [ -n "${HTTP_PROXY:-}" ]; then
            echo "driver=docker" >> "$GITHUB_OUTPUT"
          else
            echo "driver=" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@v4
        if: inputs.imageStrategy == 'docker'
        with:
          driver: ${{ steps.buildx_opts.outputs.driver }}
          driver-opts: ${{ steps.buildx_opts.outputs.driver == '' && steps.buildx_opts.outputs.opts || '' }}

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.NPM_TOKEN }}

      - name: Bump to release version
        run: |
          # TD-820: PKG_JSON is 'package.json' when appPath is unset (today's
          # literal, for every existing standalone caller) and
          # 'apps/<slug>/package.json' when a monorepo caller sets it.
          PKG_JSON="${APP_PATH:+$APP_PATH/}package.json"
          node -e "
          const fs = require('fs');
          const pkg = JSON.parse(fs.readFileSync('$PKG_JSON', 'utf8'));
          pkg.version = '${{ inputs.releaseVersion }}';
          fs.writeFileSync('$PKG_JSON', JSON.stringify(pkg, null, 2) + '\n');
          "
          git add "$PKG_JSON"
          git commit -m "chore(release): v${{ inputs.releaseVersion }}"
          git tag -a "$RELEASE_TAG" -m "Release ${{ inputs.releaseVersion }}"

      - name: Build and push prod image
        if: inputs.imageStrategy == 'docker'
        uses: docker/build-push-action@v7
        with:
          # TD-821: the DOCKERFILE follows `appPath`; the BUILD CONTEXT does not
          # and must stay the repo root. This asymmetry is measured, not assumed:
          # every one of the 13 apps' Dockerfiles is written root-context-relative
          # (54 `COPY packages/<pkg>/package.json`, `COPY apps/<slug>/…` and
          # `COPY pnpm-workspace.yaml` lines apiece — the pnpm workspace siblings
          # live OUTSIDE `apps/<slug>`). Narrowing the context to `apps/<slug>`
          # was tried in v2.4.0 and fails at `COPY`:
          #   failed to calculate checksum of ref …: "/packages/ui/package.json": not found
          # (`bvv-platform` run 31822241715). So only `file:` is threaded.
          #
          # `file` is a PROVEN no-op when empty, in the action's own source
          # (v7 = docker/build-push-action src/context.ts): it is emitted only
          # under `if (inputs.file)`, so an empty string appends no `--file` flag
          # at all, and `action.yml` gives it no default. Every existing
          # standalone-repo caller (13 of them, none passing `appPath`) therefore
          # runs the byte-identical buildx command it runs today. `context:` is
          # deliberately NOT set — today's default context is already correct for
          # both the standalone and the monorepo case.
          file: ${{ inputs.appPath != '' && format('{0}/Dockerfile', inputs.appPath) || '' }}
          push: true
          secrets: |
            NPM_TOKEN=${{ secrets.NPM_TOKEN }}
          build-args: |
            APP_BASE_PATH=${{ inputs.basePath }}
            NEXT_PUBLIC_APP_BASE_PATH=${{ inputs.basePath }}
            NEXT_PUBLIC_BVV_ENV=production
            NEXT_PUBLIC_APP_VERSION=${{ inputs.releaseVersion }}
            APP_GIT_COMMIT=${{ github.sha }}
            APP_BUILD_TIME=${{ fromJSON(toJSON(github.event.repository.updated_at)) }}
            ${{ steps.buildx_opts.outputs.build_args }}
          tags: |
            ${{ env.IMAGE }}:${{ inputs.releaseVersion }}
            ${{ env.IMAGE }}:latest
          # k8s-workspace:TD-679: registry cache-from/cache-to conditioned off on
          # self-hosted (liv26) — same `!contains(inputs.ciRunsOn, 'self-hosted')`
          # formula as TD-294's already-fixed app-ci.yml. TD-282's classic-driver
          # local BuildKit cache is already warm/shared on liv26, so the registry
          # round-trip over liv26's 50/50 Mbit WAN link (ADR-047) is pure
          # redundant cost. ubuntu-latest fallback (default `ciRunsOn`) is
          # unchanged — genuinely needs registry cache, ephemeral VM per release.
          cache-from: ${{ !contains(inputs.ciRunsOn, 'self-hosted') && format('type=registry,ref=ghcr.io/tradefairs/{0}:buildcache', inputs.slug) || '' }}
          cache-to: ${{ !contains(inputs.ciRunsOn, 'self-hosted') && format('type=registry,ref=ghcr.io/tradefairs/{0}:buildcache,mode=max', inputs.slug) || '' }}

      # ── Crane image path (imageStrategy: crane — ADR-083 krok 5b) ────────────
      # Same ceremony position as the docker step above: runs AFTER "Bump to
      # release version" (so apps/<slug>/package.json already reads
      # releaseVersion) and pushes the SAME two tags
      # (ghcr.io/tradefairs/<slug>:<releaseVersion> + :latest), so the
      # deploy-prod job's `ctr pull $IMAGE:$IMAGE_TAG` is untouched. The
      # composite lives in the CALLER's checkout (monorepo-only) and owns all
      # per-app detail: INVENTORY lookup, pnpm/turbo prod-profile build,
      # crane append onto the pinned bvv-app-base. `secrets: inherit` already
      # delivers NPM_TOKEN (ghcr login + @tradefairs npm scope).
      - name: Build and push prod image (crane layer-append)
        if: inputs.imageStrategy == 'crane'
        uses: ./.github/actions/release-crane-image
        with:
          app: ${{ inputs.slug }}
          base-path: ${{ inputs.basePath }}
          release-version: ${{ inputs.releaseVersion }}
          git-commit: ${{ github.sha }}
          npm-token: ${{ secrets.NPM_TOKEN }}

      - name: Bump to next SNAPSHOT
        run: |
          # TD-820: same PKG_JSON resolution as the release bump above — the
          # SNAPSHOT must be written back to the same file the pre-flight read.
          PKG_JSON="${APP_PATH:+$APP_PATH/}package.json"
          node -e "
          const fs = require('fs');
          const pkg = JSON.parse(fs.readFileSync('$PKG_JSON', 'utf8'));
          pkg.version = '${{ inputs.nextVersion }}-SNAPSHOT';
          fs.writeFileSync('$PKG_JSON', JSON.stringify(pkg, null, 2) + '\n');
          "
          git add "$PKG_JSON"
          git commit -m "chore(release): bump to ${{ inputs.nextVersion }}-SNAPSHOT"

      - name: Push tag (unaffected by branch protection)
        # k8s-workspace:TD-825, Candidate 2: the tag targets refs/tags/..., a
        # different ref namespace from refs/heads/main, so it is not subject
        # to bvv-platform/main's branch protection at all. Pushed alone and
        # first so the release artifact (this tag + the image already pushed
        # above) lands even if the branch-push/PR path below is slow — the
        # tag object was already created locally by "Bump to release
        # version" and is pushed byte-identical to before, just as its own
        # `git push` instead of sharing a line with the branch push.
        run: git push origin "$RELEASE_TAG"

      - name: Open release-bump PR
        # k8s-workspace:TD-825, Candidate 1: bvv-platform/main requires the
        # td-linkage-pr-gate status check, which triggers ONLY on
        # `pull_request` (opened/synchronize/reopened/edited) — a direct
        # `git push origin HEAD:main` can never produce that event, so it is
        # unconditionally rejected (GH006) regardless of content. Route the
        # two local bump commits through a real PR instead.
        #
        # Branch name includes slug + releaseVersion: unique per release
        # (releaseVersion is already guaranteed unique by the pre-flight
        # SNAPSHOT check above), so concurrent/sequential releases of
        # different apps (or re-releases after a fixed SNAPSHOT) never
        # collide on the branch name.
        #
        # `NPM_TOKEN`, NOT `secrets.GITHUB_TOKEN`: GitHub does not fire
        # `pull_request`-triggered workflows for PRs authored by the
        # default `GITHUB_TOKEN` (recursion-prevention rule) — this is not
        # a theory, it is the exact, already-documented reason
        # `regen-python-client.yml` (bvv-platform) uses `REGEN_PR_TOKEN`
        # instead of `GITHUB_TOKEN` to author its auto-PR (TD-116, PR #74:
        # a GITHUB_TOKEN-authored PR got no CI checks at all). `NPM_TOKEN`
        # is already this fleet's standing PAT, already present in every
        # caller repo, already used elsewhere in this same job (ghcr
        # login, buildx secret) — reused here for the same reason, not a
        # new credential.
        id: bump_pr
        env:
          GH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          BUMP_BRANCH="release/${{ inputs.slug }}-${{ inputs.releaseVersion }}"
          git push origin "HEAD:refs/heads/$BUMP_BRANCH"

          # td-linkage-pr-gate --gate-pr reads THIS PR's own body for a
          # `TD:` line — it would otherwise fail the very check this PR
          # exists to satisfy. TD-825 is the fix that routes the release
          # ceremony through this PR at all, so it is the correct citation
          # here (not the per-app release TD, which is the ceremony this
          # workflow always performs).
          PR_URL=$(gh pr create \
            --repo "${{ github.repository }}" \
            --base main \
            --head "$BUMP_BRANCH" \
            --title "chore(release): ${{ inputs.slug }} v${{ inputs.releaseVersion }}" \
            --body "Automated release-bump PR opened by \`app-release.yml\` (k8s-workspace:TD-825) for \`${{ inputs.slug }}\` v${{ inputs.releaseVersion }} -> ${{ inputs.nextVersion }}-SNAPSHOT.

          TD: TradeFairs/k8s-workspace:TD-825")
          echo "pr-url=$PR_URL" >> "$GITHUB_OUTPUT"
          PR_NUMBER="${PR_URL##*/}"
          echo "pr-number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          echo "Opened release-bump PR: $PR_URL"

      - name: Wait for the release-bump PR to become mergeable, then merge it
        # Poll GitHub's OWN mergeability verdict (`mergeStateStatus`) rather
        # than any named check. Fail the job LOUDLY (non-zero exit) on any
        # failure/timeout rather than silently skipping deploy-prod — a
        # release failure must be visible, never a quiet no-op
        # (k8s-workspace:TD-825 Step 1e).
        #
        # ── Why this no longer polls td-linkage-pr-gate by name ──────────────
        # The previous implementation waited for the check NAMED
        # `td-linkage-pr-gate` and, on finding it absent, merged immediately.
        # Its justification was verified-true on 2026-08-27: "bvv-platform/main
        # has NO required status checks and NO rulesets". ADR-083 krok 4 made
        # `ci-required` a required status check on bvv-platform/main on
        # 2026-08-28 — and the comment, not the code, was what held the
        # assumption. The result was deterministic, not a race: the step saw
        # the gate absent ~12s after opening the PR, called `gh pr merge`, and
        # GitHub refused with "the base branch policy prohibits the merge"
        # because `ci-required` had not reported yet (it finished 15 minutes
        # later). bvv-portal 0.3.0 was tagged and its image pushed, but
        # deploy-prod never ran.
        #
        # `mergeStateStatus` is the branch-protection verdict itself, so this
        # loop needs no knowledge of which checks exist or what they are
        # called, and survives any future change to branch protection:
        #   CLEAN     — mergeable, all required checks green      → merge
        #   UNSTABLE  — mergeable; only NON-required checks failing/pending
        #               (a required check still pending reports BLOCKED, not
        #               UNSTABLE) → merge
        #   BLOCKED   — required check pending or failing, or review required
        #   BEHIND    — base moved; needs an update branch
        #   DIRTY     — merge conflict
        #   UNKNOWN   — GitHub is still computing mergeability
        # BLOCKED/BEHIND/UNKNOWN are polled (transient); DIRTY fails fast.
        #
        # Plain merge commit (`--merge`, not `--squash`): squash-merging
        # rewrites the commit SHA, which would force re-deriving the
        # actual merged SHA before the tag (already pushed above, against
        # the PRE-merge commit) can be trusted to match `main` — the exact
        # ordering mistake documented from TD-820's human-gate merge. A
        # plain merge/fast-forward keeps the bump commit's SHA identical
        # pre- and post-merge, so the re-diff below is a confirmation, not
        # a re-tagging operation.
        env:
          GH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          PR_NUMBER="${{ steps.bump_pr.outputs.pr-number }}"
          PR_URL="${{ steps.bump_pr.outputs.pr-url }}"

          echo "Waiting for PR #$PR_NUMBER to become mergeable..."
          # 60 × 20s = 20 minutes. Sized against the required check it is
          # actually waiting for: `ci-required` on bvv-platform took ~16
          # minutes on the run that exposed this bug, so a 10-minute window
          # would have failed a perfectly healthy release.
          STATE=""
          for i in $(seq 1 60); do
            # An API failure leaves STATE empty, which is treated as "unknown,
            # keep polling" — never as "mergeable".
            STATE=$(gh pr view "$PR_NUMBER" --repo "${{ github.repository }}" \
                      --json mergeStateStatus --jq '.mergeStateStatus // ""' 2>/dev/null || true)

            case "$STATE" in
              CLEAN|UNSTABLE)
                echo "PR #$PR_NUMBER is mergeable (mergeStateStatus=$STATE)"
                break
                ;;
              DIRTY)
                echo "::error::Release-bump PR #$PR_NUMBER ($PR_URL) has a merge conflict with main (mergeStateStatus=DIRTY) — refusing to merge. Resolve the conflict; the tag and image for this release already exist."
                exit 1
                ;;
            esac

            echo "Attempt $i/60: mergeStateStatus='${STATE:-UNKNOWN}', waiting 20s..."
            sleep 20
          done
          if [ "$STATE" != "CLEAN" ] && [ "$STATE" != "UNSTABLE" ]; then
            echo "::error::Release-bump PR #$PR_NUMBER ($PR_URL) did not become mergeable within the poll window (mergeStateStatus='${STATE:-UNKNOWN}') — refusing to merge. If this is BLOCKED, a required status check has not passed; check the PR."
            exit 1
          fi

          if ! gh pr merge "$PR_NUMBER" --repo "${{ github.repository }}" --merge --delete-branch; then
            echo "::error::Failed to merge release-bump PR #$PR_NUMBER ($PR_URL) — refusing to continue silently."
            exit 1
          fi

          # Re-derive the actual merged SHA rather than assuming the
          # pre-merge branch tip landed unchanged (k8s-workspace:TD-820
          # lesson, re-applied here even though a plain merge is expected
          # to preserve the bump commit's SHA — verify, don't assume).
          for i in $(seq 1 30); do
            MERGE_COMMIT=$(gh pr view "$PR_NUMBER" --repo "${{ github.repository }}" --json mergeCommit --jq '.mergeCommit.oid // empty' 2>/dev/null || true)
            [ -n "$MERGE_COMMIT" ] && break
            echo "Waiting for merge commit SHA to be reported (attempt $i/30)..."
            sleep 5
          done
          if [ -z "$MERGE_COMMIT" ]; then
            echo "::error::Could not resolve the merged SHA for PR #$PR_NUMBER ($PR_URL) after merge — refusing to proceed without confirming what actually landed on main."
            exit 1
          fi
          echo "Merged release-bump PR #$PR_NUMBER at $MERGE_COMMIT"

          MAIN_SHA=$(git ls-remote origin refs/heads/main | cut -f1)
          echo "origin/main is now at $MAIN_SHA"
          if [ "$MAIN_SHA" != "$MERGE_COMMIT" ]; then
            echo "::warning::origin/main ($MAIN_SHA) has moved past the merge commit ($MERGE_COMMIT) — another push landed concurrently. The release bump itself is still on main (verified via the PR's merge commit), this is only informational."
          fi

      - name: Create GitHub Release
        run: |
          gh release create "$RELEASE_TAG" \
            --generate-notes \
            --title "$RELEASE_TAG"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Deploy to prod (self-hosted runner) ──────────────────────────────────────
  deploy-prod:
    # Pin to the liv11 runner: prod deploy needs sudo + direct kubectl/k3s access
    # to the liv11 cluster. The liv56-test-gate runner shares the default
    # `self-hosted` label but has neither, so a bare `runs-on: self-hosted` could
    # land there and fail (`sudo: command not found`) or misdeploy.
    runs-on: [self-hosted, liv11]
    timeout-minutes: 20
    needs: release
    # `needs` alone would skip this job whenever `release` is skipped, so
    # deployOnly needs `always()` to reach it. The condition is written to
    # keep the ONLY previously-possible path intact: a FAILED or CANCELLED
    # release must still block the deploy. Spelled out per mode:
    #   deployOnly=false → requires release.result == 'success' (today's `needs`)
    #   deployOnly=true  → release is 'skipped'; deploy runs off the existing tag
    if: >-
      ${{ always() && !cancelled() &&
          (inputs.deployOnly && needs.release.result == 'skipped'
           || !inputs.deployOnly && needs.release.result == 'success') }}
    env:
      IMAGE: ghcr.io/tradefairs/${{ inputs.slug }}
      IMAGE_TAG: ${{ inputs.releaseVersion }}
      # TD-821: `deploy-prod` is a SEPARATE job from `release`, so it does not
      # inherit the release job's APP_PATH — it is re-declared here.
      APP_PATH: ${{ inputs.appPath }}
      # TD-821: repo-root-relative path to the app's `k8s/` directory. With the
      # default empty `appPath` this is the literal 'k8s' used today at all
      # three prod-overlay sites and both job-migrate sites; a monorepo caller
      # passing `apps/service-desk` gets 'apps/service-desk/k8s'.
      K8S_DIR: ${{ inputs.appPath != '' && format('{0}/k8s', inputs.appPath) || 'k8s' }}

    steps:
      - uses: actions/checkout@v5
        with:
          # TD-820: the tag created by the release job. Empty tagPrefix (every
          # existing caller) yields 'v' + releaseVersion, i.e. today's literal.
          ref: ${{ inputs.tagPrefix != '' && inputs.tagPrefix || 'v' }}${{ inputs.releaseVersion }}

      - name: Checkout infra-liv11 (cluster-specific SOPS material, ADR-082)
        # ADR-082: SOPS material for a cluster lives in that cluster's infra repo
        # at `environments/{prod,test}/<app>/secrets.enc.yaml`, so the decrypt
        # step below needs infra-liv11 IN THE WORKSPACE — this job otherwise only
        # ever consumes infra-liv11 as a remote kustomize base (Apply prod
        # manifests).
        #
        # `path:` is MANDATORY: a default-path checkout would overwrite the
        # caller's own checkout above and break every later step.
        #
        # `NPM_TOKEN`, not `GITHUB_TOKEN`: infra-liv11 is PRIVATE and
        # `GITHUB_TOKEN` is scoped to the caller's own repo, so it cannot read
        # it. `NPM_TOKEN` is org-scoped, exists in every caller repo, and is
        # already used by THIS job for exactly this repo (the remote kustomize
        # base url-rewrite in "Apply prod manifests"). It reaches this reusable
        # workflow because every caller passes `secrets: inherit` — the
        # `workflow_call` block deliberately declares NO `secrets:` section, and
        # adding one would break every existing caller.
        uses: actions/checkout@v5
        with:
          repository: TradeFairs/infra-liv11
          path: .infra-liv11
          ref: main
          token: ${{ secrets.NPM_TOKEN }}

      - name: Resolve overlay dir and prod namespace
        # PLAN-250 krok 4: the prod overlay moves out of the app repo into
        # infra-liv11 `environments/prod/<slug>/` (the app must not know where it
        # is installed). Resolution is infra-first with a legacy fallback — the
        # same shape the SOPS secret step already uses — so this workflow change
        # merges as a NO-OP: with zero apps migrated every app takes the legacy
        # branch and only emits a warning.
        #
        # The kustomize `namespace:` directive in the overlay is the canonical target
        # namespace — `kubectl apply -f` (below) honours it, so the verify/rollout steps
        # must use the SAME namespace, not assume slug. Co-located apps (e.g.
        # jira-status-web → `jira-status`) set a non-slug namespace here; deriving it
        # keeps rollout-status/verify/smoke pointed at where the deploy actually landed.
        # Falls back to the slug when the overlay omits `namespace:` (preserves old default).
        #
        # TD-821: the overlay path follows `appPath` via K8S_DIR (empty appPath
        # → the literal `k8s/overlays/prod/kustomization.yaml` read today).
        # This is also the single place that validates `appPath` resolves: the
        # prod overlay is mandatory for every app (13/13 measured), so if it is
        # absent the path is wrong and the deploy must fail LOUDLY here rather
        # than let `awk` return empty, silently fall back to the slug namespace
        # and deploy somewhere unintended (TD-817 AC-3, ADR-071 §10).
        run: |
          INFRA_OVERLAY=".infra-liv11/environments/prod/${{ inputs.slug }}"
          LEGACY_OVERLAY="$K8S_DIR/overlays/prod"
          if [ -f "$INFRA_OVERLAY/kustomization.yaml" ]; then
            OVERLAY_DIR="$INFRA_OVERLAY"
            echo "Overlay: infra-liv11 (migrated) — $OVERLAY_DIR"
          elif [ -f "$LEGACY_OVERLAY/kustomization.yaml" ]; then
            OVERLAY_DIR="$LEGACY_OVERLAY"
            echo "::warning::Using legacy in-app overlay $LEGACY_OVERLAY — migrate to infra-liv11 environments/prod/${{ inputs.slug }}/ (PLAN-250 krok 4)"
          else
            echo "::error::No kustomization.yaml at $INFRA_OVERLAY or $LEGACY_OVERLAY — appPath='${APP_PATH}' does not resolve to an app directory in this repo. Refusing to deploy."
            exit 1
          fi
          NS=$(awk '/^namespace:[[:space:]]/{print $2; exit}' "$OVERLAY_DIR/kustomization.yaml")
          NS=${NS:-${{ inputs.slug }}}
          echo "OVERLAY_DIR=$OVERLAY_DIR" >> "$GITHUB_ENV"
          echo "NS=$NS" >> "$GITHUB_ENV"
          echo "Resolved prod namespace from $OVERLAY_DIR: $NS"

      - name: Ensure namespace exists
        # Cattle-not-pets fáze 1 (platform-workspace docs/design/cattle-not-pets.md):
        # namespace zakládá deploy, ne SSH. Musí běžet PŘED aplikací Secretu a
        # ConfigMapy (obě jdou s `-n "$NS"` do namespace, který u čerstvé appky
        # ještě neexistuje — render overlaye s Namespace resourcem se aplikuje
        # až později). `kubectl apply` na Namespace je idempotentní; u
        # existujících appek je to no-op. Chybějící soubor = zdokumentované
        # výjimky (ns `platform` vlastní platform/namespaces/, k2-mcp vlastní
        # repo) nebo nemigrovaná appka — skip s notice, ne fail.
        run: |
          NS_FILE=".infra-liv11/environments/prod/${{ inputs.slug }}/namespace.yaml"
          if [ -f "$NS_FILE" ]; then
            sudo kubectl apply -f "$NS_FILE"
          else
            echo "::notice::No namespace.yaml at $NS_FILE — skipping (namespace owned elsewhere or app not migrated)"
          fi

      - name: Free Docker disk space
        run: sudo docker system prune -f

      - name: Ensure k3s containerd proxy
        run: |
          DESIRED='HTTP_PROXY=http://bvvproxy.brno.bvv.cz:8080
          HTTPS_PROXY=http://bvvproxy.brno.bvv.cz:8080
          NO_PROXY=localhost,127.0.0.1,10.0.0.0/8,192.168.0.0/16,.svc,.cluster.local'
          ENV_FILE=/etc/systemd/system/k3s.service.env
          CURRENT=$(cat "$ENV_FILE" 2>/dev/null || true)
          if [ "$DESIRED" != "$CURRENT" ]; then
            echo "$DESIRED" | sudo tee "$ENV_FILE"
            sudo systemctl daemon-reload
            sudo systemctl restart k3s
            echo "k3s restarted. Waiting 15s..."
            sleep 15
          else
            echo "Proxy env unchanged, skipping k3s restart."
          fi
          sudo kubectl get nodes

      - name: Pull image into k3s containerd
        # PLAN-047: direct ctr pull from ghcr.io — bypasses docker save/import pipe,
        # containerd fetches only missing layers via layer dedup (~17-25× faster).
        run: |
          # TD-817 (k8s-workspace:TD-817): pull with `NPM_TOKEN`, NOT
          # `GITHUB_TOKEN` — the prod twin of the fix TD-822
          # (k8s-workspace:TD-822) already applied to app-deploy-test.yml's
          # identical step.
          #
          # `GITHUB_TOKEN` is scoped to the repository the run lives in. Every
          # ghcr package here is owned by the org but *linked* to a repo, and
          # that link is what a repo-scoped token is checked against: 6
          # packages (service-desk, service-catalog, dovolenky,
          # bvv-directory-api, jira-status, jira-status-web) are `private`
          # and linked to their own (still-existing) source repo, so a run in
          # `bvv-platform` carries a `GITHUB_TOKEN` with no permission on
          # them (measured on the test path, run 31823926618: `403
          # Forbidden`) — the same registry-auth shape applies here because
          # this step is byte-identical modulo the credential.
          #
          # `NPM_TOKEN` is org-scoped, exists in all caller repos, and is
          # already the fleet's ghcr credential everywhere else in this same
          # workflow (L235, L277). It is also already placed on this runner
          # by the `git config --global` url-rewrite a few steps below
          # (L448), so using it here adds no new secret exposure.
          sudo k3s ctr -n k8s.io images pull \
            --user "${{ github.actor }}:${{ secrets.NPM_TOKEN }}" \
            "$IMAGE:$IMAGE_TAG"
          echo "Pulled into k3s containerd:"
          sudo k3s ctr -n k8s.io images ls -q | grep "${{ inputs.slug }}" | head -5

      - name: Run DB migrations (pre-deploy Job)
        run: |
          # TD-821: the skip below is only legitimate for a RESOLVED path. Before
          # TD-821 the guard was a bare `[ ! -f k8s/job-migrate.yaml ]`, which at
          # a monorepo repo root is ALWAYS true — so a caller passing
          # `appPath: apps/<slug>` would skip every migration silently and green
          # (TD-817 AC-3: migrations must never be silently dropped). The two
          # cases are now distinguishable:
          #   - `$K8S_DIR` exists but has no `job-migrate.yaml` → genuinely
          #     stateless app (6 of 13 have no migration manifest) → skip, as today.
          #   - `$K8S_DIR` does not exist at all → `appPath` is unresolvable →
          #     hard fail, never a green skip.
          # 2026-08-29: the guard now tests `$APP_PATH`, not `$K8S_DIR`. The
          # premise above — "single-app repos always have a `k8s/` directory (it
          # is where the prod overlay just read from)" — died when the overlays
          # moved to infra-liv11/environments/. For an app whose `k8s/` held ONLY
          # `overlays/` (jira-status-web, bvv-portal) the directory vanished with
          # the overlay, and this guard hard-failed a release that should have
          # skipped: both are stateless, with no `base/` and no `job-migrate.yaml`.
          # `$APP_PATH` is what the error message was always really asserting
          # about ("does not resolve to an app directory"), so test that directly.
          # Empty `appPath` → repo root → always exists → single-app repos
          # unchanged. A missing `k8s/` now falls through to the stateless skip
          # below, which is the correct outcome: no manifest, no migration.
          if [ -n "$APP_PATH" ] && [ ! -d "$APP_PATH" ]; then
            echo "::error::$APP_PATH does not exist — appPath='${APP_PATH}' does not resolve to an app directory in this repo. Refusing to skip migrations silently."
            exit 1
          fi
          # Optional: stateless apps (e.g. bvv-directory-web) have no k8s/job-migrate.yaml.
          if [ ! -f "$K8S_DIR/job-migrate.yaml" ]; then
            echo "::notice::$K8S_DIR/job-migrate.yaml not present — stateless app, skipping migrations"
            exit 0
          fi
          COMMIT_SHA=$(git rev-parse --short HEAD)
          JOB_NAME="${{ inputs.slug }}-migrate-${COMMIT_SHA}"
          sudo kubectl -n "$NS" delete job "$JOB_NAME" --ignore-not-found
          # Strip any hardcoded `namespace:` from the manifest — applied with -n "$NS".
          sed "s|__JOB_NAME__|${JOB_NAME}|g; s|__IMAGE_TAG__|${IMAGE_TAG}|g; /^[[:space:]]*namespace:[[:space:]]/d" "$K8S_DIR/job-migrate.yaml" \
            | sudo kubectl apply -n "$NS" -f -
          set +e
          sudo kubectl -n "$NS" wait --for=condition=complete --timeout=300s "job/$JOB_NAME"
          COMPLETE=$?
          if [ $COMPLETE -ne 0 ]; then
            echo "::error::Migration Job did not complete successfully"
            sudo kubectl -n "$NS" describe "job/$JOB_NAME" || true
            sudo kubectl -n "$NS" logs --tail=200 "job/$JOB_NAME" || true
            exit 1
          fi
          set -e

      - name: Decrypt and apply SOPS secret (if migrated)
        # ADR-082 (amends ADR-013): SOPS material is cluster-specific config and
        # lives in `infra-<cluster>`, at
        # `environments/{prod,test}/<app>/secrets.enc.yaml`, with `.sops.yaml` per
        # ENVIRONMENT (not per repo) so each environment has its own age key.
        # TD-842 rework 2026-08-24: the originally shipped step read
        # `$K8S_DIR/overlays/prod/secrets.enc.yaml`, a path relative to the
        # CALLING app repo's checkout — infra-liv11 is never in that checkout
        # (this job consumes it only as a remote kustomize base). With the secret
        # in infra-liv11 that `-f` test is simply false, so the step took the
        # skip branch and the PROD deploy went green having applied NO Secret.
        # Hence the dedicated `.infra-liv11` checkout above and the infra-first
        # resolution below.
        #
        # Resolution order is deliberate: once an app is migrated, infra-liv11 is
        # authoritative and a stale leftover copy in the app repo must not win.
        # The legacy app-repo path stays honoured (with a ::warning:: so the
        # transitional state is visible, not silent) until PLAN-250 wave 1
        # completes.
        #
        # Gated purely on file presence. Placed BEFORE "Apply prod manifests" —
        # the Secret must exist before the Deployment referencing it is applied,
        # otherwise a fresh-migration app's first rollout would fail on a missing
        # Secret. For apps that haven't migrated yet NEITHER file exists, so this
        # step is a clean no-op: today's manual Secret-application deploy
        # behavior is completely unchanged for them.
        #
        # No `SOPS_AGE_KEY_FILE` pinning and no `--age`/recipient flag: `sops -d`
        # selects the private key by matching the file's own recipients against
        # the keys available to the runner. Pinning a key here would silently
        # defeat the per-environment key separation ADR-082 requires.
        run: |
          # `pipefail` so a failing `sops -d` (wrong/absent key) fails the STEP.
          # Without it the pipeline's exit status is `kubectl apply`'s, which
          # happily succeeds on empty stdin — i.e. "secret not applied" would be
          # another silent green. See TD-842 R4.
          set -o pipefail
          INFRA_SECRET=".infra-liv11/environments/prod/${{ inputs.slug }}/secrets.enc.yaml"
          LEGACY_SECRET="$K8S_DIR/overlays/prod/secrets.enc.yaml"
          if [ -f "$INFRA_SECRET" ]; then
            SECRET_FILE="$INFRA_SECRET"
          elif [ -f "$LEGACY_SECRET" ]; then
            SECRET_FILE="$LEGACY_SECRET"
            echo "::warning::Using legacy app-repo secret path $LEGACY_SECRET — migrate to infra-liv11/environments/prod/${{ inputs.slug }}/ (ADR-082)"
          else
            SECRET_FILE=""
          fi
          if [ -n "$SECRET_FILE" ]; then
            echo "Applying SOPS secret from $SECRET_FILE"
            sops -d "$SECRET_FILE" | sudo kubectl apply -n "$NS" -f -
          else
            echo "::notice::No secrets.enc.yaml at $INFRA_SECRET or $LEGACY_SECRET — app not yet migrated to SOPS, skipping (manual secret application unchanged)"
          fi

      - name: Apply plaintext config (if migrated)
        # Design doc `config-as-code-target-state` (platform-workspace
        # docs/design/): non-secret env-bound values live NEXT TO the SOPS
        # material as a plain ConfigMap manifest — plaintext in git, so
        # `git log -p` answers "when did SYNC_CRON change". A key lives in
        # exactly ONE of config.yaml / secrets.enc.yaml, never both. Gated
        # purely on file presence; placed BEFORE "Apply prod manifests" for the
        # same reason as the Secret above (the Deployment's envFrom must
        # resolve). The Deployment's configMapRef is `optional: true`, so
        # un-migrated environments of a migrated app keep working.
        run: |
          INFRA_CONFIG=".infra-liv11/environments/prod/${{ inputs.slug }}/config.yaml"
          if [ -f "$INFRA_CONFIG" ]; then
            echo "Applying plaintext config from $INFRA_CONFIG"
            sudo kubectl apply -n "$NS" -f "$INFRA_CONFIG"
          else
            echo "::notice::No config.yaml at $INFRA_CONFIG — skipping (no plaintext config for this app/env)"
          fi

      - name: Apply prod manifests
        env:
          LOAD_RESTRICTOR: ${{ inputs.loadRestrictor }}
        run: |
          # render-then-apply (PLAN-104 X2): kubectl kustomize as runner user (with
          # NPM_TOKEN url-rewrite for any private remote base), then sudo apply the
          # static manifests. Works with inline OR remote k8s base. Once an overlay
          # is migrated it lives inside the .infra-liv11 checkout and references
          # k8s-base by LOCAL path — its render is offline and the rewrite is then a
          # harmless no-op (kept until the last app is migrated).
          git config --global url."https://x-access-token:${{ secrets.NPM_TOKEN }}@github.com/".insteadOf "https://github.com/"
          # $OVERLAY_DIR is resolved above (infra-liv11 if migrated, app repo otherwise).
          #
          # NOTE: this previously tried `kubectl kustomize edit set image ... || sed`.
          # That command does not exist (`kubectl kustomize` takes a path, there is
          # no `edit` subcommand), so the fleet ALWAYS fell through to the sed —
          # silently, because stderr was discarded. Dead half removed; the sed is
          # now the only path and is asserted to have taken effect.
          cd "$OVERLAY_DIR"
          if ! grep -q '^[[:space:]]*newTag:' kustomization.yaml; then
            echo "::error::$OVERLAY_DIR/kustomization.yaml has no 'newTag:' line — cannot set image tag. Refusing to deploy."
            exit 1
          fi
          sed -i "s/newTag: .*/newTag: $IMAGE_TAG/" kustomization.yaml
          if ! grep -q "newTag: $IMAGE_TAG" kustomization.yaml; then
            echo "::error::Failed to set newTag to $IMAGE_TAG in $OVERLAY_DIR/kustomization.yaml"
            exit 1
          fi
          cat kustomization.yaml
          cd "$GITHUB_WORKSPACE"
          # LOAD_RESTRICTOR is empty for every app except those whose base loads files
          # from outside k8s/ (jira-status: configMapGenerator on ../../notification_rules.yaml).
          kubectl kustomize ${LOAD_RESTRICTOR:-} "$OVERLAY_DIR/" > /tmp/${{ inputs.slug }}-prod-manifests.yaml
          sudo kubectl apply -f /tmp/${{ inputs.slug }}-prod-manifests.yaml

      - name: Wait for rollout (with retry)
        run: |
          set +e
          APP=${{ inputs.slug }}
          for attempt in 1 2 3; do
            if sudo kubectl rollout status deployment/$APP -n "$NS" --timeout=120s; then
              echo "Rollout succeeded on attempt $attempt"
              exit 0
            fi
            if [ $attempt -lt 3 ]; then
              echo "::warning::Rollout attempt $attempt failed, force-deleting stuck Terminating pods..."
              STUCK=$(sudo kubectl get pods -n "$NS" -l app=$APP --no-headers 2>/dev/null | awk '$3 == "Terminating" {print $1}')
              if [ -n "$STUCK" ]; then
                echo "Stuck Terminating pods: $STUCK"
                echo "$STUCK" | xargs -r sudo kubectl delete pod -n "$NS" --force --grace-period=0 || true
              else
                echo "No stuck Terminating pods found"
              fi
              sleep 5
            fi
          done
          echo "::error::Rollout failed after 3 attempts"
          exit 1

      - name: Verify deployed pod runs the release image
        run: |
          EXPECTED="$IMAGE:$IMAGE_TAG"
          DEPLOY_IMG=$(sudo kubectl get deployment ${{ inputs.slug }} -n "$NS" \
            -o jsonpath='{.spec.template.spec.containers[0].image}')
          echo "Expected:        $EXPECTED"
          echo "Deployment spec: $DEPLOY_IMG"
          [ "$DEPLOY_IMG" != "$EXPECTED" ] && { echo "::error::Deployment image mismatch"; exit 1; }
          # Retry: right after rollout an OLD pod can still be Running (no deletionTimestamp
          # yet) and get picked. Wait until every running Deployment pod runs EXPECTED.
          # --field-selector=status.phase=Running excludes Completed CronJob/migrate Job
          # pods that share the `app=<slug>` label (they linger for days on old images and
          # otherwise make $STALE permanently non-empty — the dovolenky v0.11.0 false-failure).
          for attempt in 1 2 3 4 5 6; do
            STALE=$(sudo kubectl get pod -n "$NS" -l app=${{ inputs.slug }} --field-selector=status.phase=Running \
              -o go-template='{{range .items}}{{if not .metadata.deletionTimestamp}}{{(index .spec.containers 0).image}}{{"\n"}}{{end}}{{end}}' \
              | grep -v '^$' | grep -vF "$EXPECTED" || true)
            if [ -z "$STALE" ]; then
              echo "::notice::Deployed image verified: all running pods on $EXPECTED (attempt $attempt)"
              exit 0
            fi
            echo "Attempt $attempt: non-terminating pod(s) still on old image:"; echo "$STALE"
            sleep 5
          done
          echo "::error::Running pod image mismatch after retries — still on old image"
          exit 1

      - name: Smoke test ${{ inputs.basePath }}/api/version on prod
        if: inputs.smokeMode == 'ingress'
        run: |
          EXPECTED_VERSION="${{ inputs.releaseVersion }}"
          for i in 1 2 3 4 5; do
            VER=$(curl -fsk --noproxy 'liv11.brno.bvv.cz' \
              https://liv11.brno.bvv.cz${{ inputs.basePath }}/api/version \
              | python3 -c "import sys,json; print(json.load(sys.stdin).get('version',''))" 2>/dev/null)
            [ "$VER" = "$EXPECTED_VERSION" ] && break
            echo "Smoke attempt $i: got $VER, expected $EXPECTED_VERSION — retry in 3s"
            sleep 3
          done
          [ "$VER" = "$EXPECTED_VERSION" ] || { echo "::error::Smoke test failed after 5 attempts (got $VER)"; exit 1; }

      - name: Smoke test ${{ inputs.basePath }}/api/version on prod (cluster-internal via port-forward)
        # smokeMode=port-forward (TD-224, ADR-045 api-internal profile): no public
        # IngressRoute (ADR-020 security boundary) — smoke via kubectl port-forward.
        # Procedure taken verbatim from the inline bvv-directory-api release.yml
        # (incl. PF cleanup and the environment=production assert).
        if: inputs.smokeMode == 'port-forward'
        run: |
          sleep 10
          sudo kubectl port-forward -n "$NS" svc/${{ inputs.slug }} 19892:3000 &
          PF_PID=$!
          sleep 3
          RESPONSE=$(curl -fsSk \
            --retry 3 --retry-delay 5 --retry-all-errors \
            --max-time 10 \
            http://127.0.0.1:19892${{ inputs.basePath }}/api/version)
          kill $PF_PID 2>/dev/null || true
          echo "Response: $RESPONSE"
          python3 -c "
          import sys, json
          data = json.load(sys.stdin)
          got = data.get('version', '')
          expected = '${{ inputs.releaseVersion }}'
          assert got == expected, f'Version mismatch: got={got!r} expected={expected!r}'
          env = data.get('environment', '')
          assert env == 'production', f'Expected environment=production, got={env!r}'
          print(f'PASS: /api/version returned version={got!r} environment={env!r}')
          " <<< "$RESPONSE"

      - name: Debug pod status (always)
        if: always()
        run: |
          echo "=== Pods ==="
          sudo kubectl get pods -n "$NS" -o wide
          echo "=== Events ==="
          sudo kubectl get events -n "$NS" --sort-by='.lastTimestamp' | tail -20
          echo "=== Pod logs ==="
          POD=$(sudo kubectl get pods -n "$NS" -l app=${{ inputs.slug }} \
            -o jsonpath='{.items[0].metadata.name}' 2>/dev/null)
          [ -n "$POD" ] && sudo kubectl logs -n "$NS" "$POD" --tail=30 2>&1 || echo "no pod logs"
